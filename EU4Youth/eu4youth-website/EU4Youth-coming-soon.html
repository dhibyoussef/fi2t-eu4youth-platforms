<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EU4Youth — Site en préparation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Changa:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --blue: #0d5ca4;
  --amber: #e4972e;
  --ink: #000;
  --font: "Montserrat", "Segoe UI", Arial, sans-serif;
  --font-ar: "Changa", "Segoe UI", Tahoma, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: #fff; }
body {
  font-family: var(--font);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
html[dir="rtl"] body { font-family: var(--font-ar); }

.page {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow-x: hidden;
  background: #fff;
}

/* —— Stitch background: peach glow + browser + magnifying glass —— */
.bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.glow {
  position: absolute;
  border-radius: 50%;
  filter: blur(40px);
}
.glow.a { top: 50px; left: 28%; width: 112px; height: 112px; background: rgba(254,215,170,.22); }
.glow.b { bottom: 12%; left: 8%; width: 192px; height: 192px; background: rgba(255,237,213,.4); filter: blur(56px); }
.glow.c { top: 38%; right: 22%; width: 80px; height: 80px; background: rgba(254,215,170,.28); filter: blur(24px); }
.bg svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.langs {
  position: relative;
  z-index: 5;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 14px clamp(14px, 3vw, 36px) 0;
  direction: ltr;
}
.langs button {
  min-width: 46px;
  height: 28px;
  border-radius: 3px;
  cursor: pointer;
  border: 1.5px solid var(--blue);
  background: #fff;
  color: var(--blue);
  font: 800 11px/1 var(--font);
  letter-spacing: .04em;
}
.langs button.on { background: var(--blue); color: #fff; }

.header {
  position: relative;
  z-index: 2;
  width: min(1120px, 94vw);
  margin: 4px auto 0;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: start;
  column-gap: clamp(10px, 2.5vw, 32px);
  direction: ltr;
  padding: 0 4px;
}
.side {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-align: center;
}
.side.l { justify-self: start; }
.side.r { justify-self: end; }
.side img {
  height: 48px;
  width: auto;
  display: block;
  object-fit: contain;
  border-radius: 1px;
  box-shadow: 0 1px 2px rgba(0,0,0,.08);
}
.side span {
  font-size: 10px;
  font-weight: 700;
  color: #000;
  line-height: 1.2;
  max-width: 16ch;
}
.side.r span { max-width: 18ch; }

/* Stitch-style EU4Youth mark (colored letter tiles) */
.brand-mark {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-self: center;
  padding-top: 2px;
}
.brand-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  width: 52px;
  height: 52px;
}
.brand-grid span {
  border-radius: 6px;
  display: grid;
  place-items: center;
  color: #fff;
  font-weight: 900;
  font-size: 15px;
  line-height: 1;
  font-family: var(--font);
}
.brand-grid .e { background: #2ca653; }
.brand-grid .u { background: #e42d62; }
.brand-grid .n { background: #12b4ba; }
.brand-grid .y { background: #f2a829; }
.brand-txt {
  display: flex;
  flex-direction: column;
  justify-content: center;
  line-height: 1;
}
.brand-txt .youth {
  font-size: clamp(1.35rem, 2.4vw, 1.75rem);
  font-weight: 900;
  color: #0c4384;
  letter-spacing: -0.02em;
  text-transform: lowercase;
}
.brand-txt .tag {
  font-size: 11px;
  font-weight: 800;
  color: #0c4384;
  margin-top: 4px;
}

.main {
  position: relative;
  z-index: 2;
  flex: 1;
  width: min(920px, 90vw);
  margin: 0 auto;
  padding: clamp(28px, 4.5vh, 48px) 12px clamp(24px, 3.5vh, 36px);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(14px, 2vh, 20px);
}
.head {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 100%;
}
h1 {
  font-size: clamp(1.15rem, 2.55vw, 1.82rem);
  font-weight: 900;
  line-height: 1.3;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  color: var(--blue);
  max-width: 38ch;
  margin: 0 auto;
}
html[lang="en"] h1 { max-width: 40ch; }
html[dir="rtl"] h1 {
  text-transform: none;
  letter-spacing: 0;
  font-size: clamp(1.35rem, 2.9vw, 2rem);
  max-width: 22ch;
  line-height: 1.45;
}
h1 .brand { color: var(--amber); }
.soon {
  font-size: clamp(1.15rem, 2.55vw, 1.82rem);
  font-weight: 900;
  line-height: 1.3;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  color: var(--blue);
}
html[dir="rtl"] .soon {
  text-transform: none;
  letter-spacing: 0;
  font-size: clamp(1.3rem, 2.7vw, 1.85rem);
}
.body, .follow {
  font-size: clamp(.88rem, 1.35vw, 1rem);
  font-weight: 800;
  line-height: 1.4;
  color: #000;
  max-width: 58ch;
}
html[dir="rtl"] .body,
html[dir="rtl"] .follow {
  max-width: 46ch;
  line-height: 1.6;
}

.footer {
  position: relative;
  z-index: 2;
  width: min(1120px, 94vw);
  margin: 0 auto;
  padding: 8px 4px clamp(22px, 3.5vh, 36px);
  direction: ltr;
}
.footer ul {
  list-style: none;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  align-items: center;
  gap: 10px 16px;
}
.footer li {
  display: grid;
  place-items: center;
  min-width: 0;
}
.footer img {
  max-height: 54px;
  max-width: 100%;
  width: auto;
  object-fit: contain;
}
.footer li:nth-child(1) img { max-height: 44px; }
.footer li:nth-child(4) img { max-height: 60px; }
.footer li:nth-child(6) img { max-height: 40px; }

@media (max-width: 760px) {
  .header {
    grid-template-columns: 1fr 1fr;
    grid-template-areas: "c c" "l r";
    row-gap: 16px;
  }
  .brand-mark { grid-area: c; }
  .side.l { grid-area: l; justify-self: center; }
  .side.r { grid-area: r; justify-self: center; }
  .brand-grid { width: 44px; height: 44px; gap: 4px; }
  .brand-grid span { font-size: 13px; border-radius: 5px; }
  .side img { height: 42px; }
  .footer ul {
    grid-template-columns: repeat(3, 1fr);
    row-gap: 20px;
  }
}
</style>
</head>

      <img id="tn" alt="Tunisie" />

function setLang(lang) {
  if (!T[lang]) lang = "fr";
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = t.doc;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const k = el.getAttribute("data-i18n");
    const v = t[k] || "";
    if (el.getAttribute("data-html") === "1") el.innerHTML = v;
    else el.textContent = v;
    if (k === "soon") el.hidden = !String(v).trim();
  });
  document.querySelectorAll("[data-lang]").forEach((b) =>
    b.classList.toggle("on", b.getAttribute("data-lang") === lang)
  );
  try { localStorage.setItem("eu4y_coming_lang", lang); } catch (e) {}
  const u = new URL(location.href);
  u.searchParams.set("lang", lang);
  history.replaceState({}, "", u);
}

function boot() {
  document.getElementById("tn").src = A.tn;
  document.getElementById("eu").src = A.eu;
  document.getElementById("projects").innerHTML = P.map(
    ([k, a]) => `<li><img src="${A[k]}" alt="${a}" /></li>`
  ).join("");
  document.querySelectorAll("[data-lang]").forEach((b) =>
    b.addEventListener("click", () => setLang(b.getAttribute("data-lang")))
  );
  const q = new URLSearchParams(location.search).get("lang");
  let lang = q && T[q] ? q : null;
  if (!lang) try { lang = localStorage.getItem("eu4y_coming_lang"); } catch (e) {}
  if (!lang || !T[lang]) {
    const n = (navigator.language || "fr").toLowerCase();
    lang = n.startsWith("ar") ? "ar" : n.startsWith("en") ? "en" : "fr";
  }
  setLang(lang);
}
document.readyState === "loading"
  ? document.addEventListener("DOMContentLoaded", boot)
  : boot();
