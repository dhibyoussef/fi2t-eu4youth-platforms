 local actors (associations, clubs, schools), translating the authority's commitment to its youth into concrete objectives and activities.", "def_ar": "وثيقة تخطيط تُعدّها جماعة محلية تحدّد أولوياتها وأنشطتها لفائدة الشباب، بالتشاور مع الفاعلين المحليين (جمعيات، نوادٍ، مدارس)، وتترجم التزام الجماعة تجاه شبابها إلى أهداف وأنشطة ملموسة."}, {"term_fr": "Coordination interministérielle", "term_en": "Interministerial coordination", "term_ar": "التنسيق بين الوزارات", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Travail de mise en cohérence entre les actions de différents ministères agissant sur un même domaine ou une même population cible — un enjeu central pour les politiques transversales, qui relèvent simultanément de plusieurs départements sectoriels.", "def_en": "The work of aligning the actions of different ministries operating in the same field or targeting the same population — a central challenge for cross-cutting policies, which fall simultaneously under several sectoral departments.", "def_ar": "عمل يهدف إلى انسجام أنشطة مختلف الوزارات العاملة في مجال واحد أو تستهدف الفئة نفسها، وهو رهان محوري للسياسات الأفقية التي تندرج في آن واحد ضمن مشمولات عدة إدارات قطاعية."}, {"term_fr": "Redevabilité (accountability)", "term_en": "Accountability", "term_ar": "المساءلة", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Obligation pour les acteurs (gouvernements, organisations, individus) de rendre compte de leurs actions, décisions et performances à ceux qu'ils servent. Elle implique transparence, explication des choix et acceptation des conséquences en cas de manquements.", "def_en": "The obligation of actors (governments, organisations, individuals) to answer for their actions, decisions and performance to those they serve. It involves transparency, explaining choices and accepting consequences in the event of shortcomings.", "def_ar": "التزام يقع على عاتق الفاعلين (حكومات، مؤسسات، أفراد) بتقديم حساب عن أفعالهم وقراراتهم وأدائهم لمن يخدمونهم، ويستلزم الشفافية وتبرير الخيارات وتحمّل النتائج في حال حصول إخلالات."}]}, {"id": "participation", "label_fr": "Participation & inclusion des jeunes", "label_en": "Youth Participation & Inclusion", "label_ar": "مشاركة الشباب وإدماجهم", "color": "#7F77DD", "terms": [{"term_fr": "Participation des jeunes", "term_en": "Youth participation", "term_ar": "مشاركة الشباب", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Implication active des jeunes dans les processus de décision qui les concernent : conception de programmes, gouvernance locale, élaboration de politiques. Elle va au-delà de la simple consultation — les jeunes sont reconnus comme acteurs à part entière dont les contributions orientent réellement les décisions.", "def_en": "The active involvement of young people in decision-making processes that affect them: programme design, local governance, policy-making. It goes beyond mere consultation — young people are recognised as full-fledged actors whose contributions genuinely shape decisions.", "def_ar": "انخراط الشباب الفاعل في مسارات اتخاذ القرار التي تعنيهم: تصميم البرامج، الحوكمة المحلية، صياغة السياسات. وتتجاوز هذه المشاركة مجرد الاستشارة، إذ يُعترف بالشباب كفاعلين كاملي الأهلية تُوجّه إسهاماتهم القرارات فعليًا."}, {"term_fr": "Inclusion sociale", "term_en": "Social inclusion", "term_ar": "الإدماج الاجتماعي", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Processus par lequel des individus ou groupes marginalisés accèdent progressivement aux ressources, droits et opportunités de la société, et participent pleinement à la vie sociale, économique et culturelle — à l'opposé de l'exclusion et de la marginalisation.", "def_en": "The process by which marginalised individuals or groups progressively gain access to society's resources, rights and opportunities, and participate fully in social, economic and cultural life — the opposite of exclusion and marginalisation.", "def_ar": "مسار يحصل من خلاله أفراد أو فئات مهمّشة بصفة تدريجية على موارد المجتمع وحقوقه وفرصه، ويشاركون بشكل كامل في الحياة الاجتماعية والاقتصادية والثقافية، على عكس الإقصاء والتهميش."}, {"term_fr": "Jeune vulnérable", "term_en": "Vulnerable young person", "term_ar": "الشاب في وضعية هشاشة", "tag_fr": "Profil cible", "tag_en": "Target profile", "tag_ar": "الفئة المستهدفة", "def_fr": "Jeune cumulant plusieurs facteurs d'exclusion ou de fragilité : chômage, statut NEET, résidence dans une région défavorisée, situation de handicap, appartenance à un ménage à faibles revenus, faible niveau de qualification. Cette notion reconnaît que les vulnérabilités se cumulent et se renforcent mutuellement.", "def_en": "A young person facing multiple factors of exclusion or fragility: unemployment, NEET status, residence in a disadvantaged area, disability, membership of a low-income household, low qualification level. This notion recognises that vulnerabilities accumulate and reinforce one another.", "def_ar": "شاب تتراكم لديه عدة عوامل إقصاء أو هشاشة: البطالة، وضعية «نيت»، الإقامة في منطقة محرومة، الإعاقة، الانتماء إلى أسرة محدودة الدخل، ضعف مستوى التأهيل. ويقرّ هذا المفهوم بأن أوجه الهشاشة تتراكم ويعزّز بعضها بعضًا."}, {"term_fr": "Forum des jeunes", "term_en": "Youth forum", "term_ar": "منتدى الشباب", "tag_fr": "Mécanisme", "tag_en": "Mechanism", "tag_ar": "آلية", "def_fr": "Espace de rencontre, d'expression et de délibération organisé pour permettre aux jeunes de formuler des propositions, d'échanger avec des décideurs et de contribuer à des processus de planification. Un outil de démocratie participative adapté aux jeunes.", "def_en": "An organised space for meeting, expression and deliberation, enabling young people to make proposals, engage with decision-makers and contribute to planning processes. A tool of participatory democracy adapted to young people.", "def_ar": "فضاء للقاء والتعبير والتداول يُنظَّم لتمكين الشباب من صياغة مقترحات والتحاور مع صنّاع القرار والمساهمة في مسارات التخطيط، وهو أداة من أدوات الديمقراطية التشاركية الموجهة للشباب."}, {"term_fr": "Consultation participative", "term_en": "Participatory consultation", "term_ar": "التشاور التشاركي", "tag_fr": "Méthode", "tag_en": "Method", "tag_ar": "منهجية", "def_fr": "Processus structuré invitant des citoyens ou des parties prenantes à exprimer leurs besoins, aspirations et idées sur des questions qui les concernent, pour alimenter la conception de programmes ou de politiques. Elle se distingue de la simple information (sens unique) et de la co-décision.", "def_en": "A structured process inviting citizens or stakeholders to express their needs, aspirations and ideas on issues that concern them, feeding into the design of programmes or policies. It is distinct from mere one-way information provision and from joint decision-making.", "def_ar": "مسار منظّم يدعو المواطنين أو أصحاب المصلحة إلى التعبير عن حاجياتهم وتطلعاتهم وأفكارهم بشأن مسائل تعنيهم، لتغذية تصميم البرامج أو السياسات، ويختلف عن مجرد الإعلام أحادي الاتجاه وعن المشاركة في القرار."}, {"term_fr": "Empowerment (autonomisation)", "term_en": "Empowerment", "term_ar": "التمكين", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Processus par lequel des individus ou des groupes développent les capacités, la confiance et les ressources pour prendre le contrôle de leur vie et exercer un pouvoir sur les décisions qui les affectent. L'autonomisation est à la fois un moyen et un objectif du développement.", "def_en": "The process by which individuals or groups develop the capacities, confidence and resources to take control of their lives and exercise power over decisions affecting them. Empowerment is both a means and an end of development.", "def_ar": "مسار يطوّر من خلاله أفراد أو جماعات قدراتهم وثقتهم بأنفسهم ومواردهم للتحكم في حياتهم وممارسة سلطة على القرارات التي تمسّهم. ويُعد التمكين وسيلة وغاية للتنمية في آن واحد."}, {"term_fr": "Représentativité des jeunes", "term_en": "Youth representativeness", "term_ar": "التمثيلية الشبابية", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Présence effective des jeunes dans les instances de décision de manière significative, et pas seulement symbolique, supposant des mécanismes formels garantissant que la voix des jeunes influence réellement les décisions.", "def_en": "The genuine — not merely symbolic — presence of young people in decision-making bodies, requiring formal mechanisms that ensure young people's voices actually influence decisions.", "def_ar": "حضور فعلي للشباب داخل هياكل اتخاذ القرار بشكل ملموس لا رمزي فقط، وهو ما يستلزم آليات رسمية تضمن أن يكون لصوت الشباب تأثير حقيقي على القرارات."}, {"term_fr": "Inclusion des personnes en situation de handicap", "term_en": "Disability inclusion", "term_ar": "إدماج الأشخاص في وضعية إعاقة", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Ensemble des démarches, conformes à la Convention des Nations Unies relative aux droits des personnes handicapées, visant à garantir que les personnes vivant avec un handicap bénéficient des mêmes droits, opportunités et services que les autres citoyens, ce qui suppose l'adaptation des espaces, des outils et des programmes.", "def_en": "The set of approaches, in line with the UN Convention on the Rights of Persons with Disabilities, aimed at ensuring that people living with disabilities enjoy the same rights, opportunities and services as other citizens, requiring the adaptation of spaces, tools and programmes.", "def_ar": "مجموع المقاربات، المتماشية مع اتفاقية الأمم المتحدة لحقوق الأشخاص ذوي الإعاقة، الهادفة إلى ضمان تمتع الأشخاص في وضعية إعاقة بنفس الحقوق والفرص والخدمات المتاحة لبقية المواطنين، وهو ما يستوجب تكييف الفضاءات والأدوات والبرامج."}]}, {"id": "acteurs", "label_fr": "Acteurs institutionnels", "label_en": "Institutional Actors", "label_ar": "الفاعلون المؤسساتيون", "color": "#5F5E5A", "terms": [{"term_fr": "CILG-VNG International", "term_en": "CILG-VNG International", "term_ar": "المركز الدولي للحوكمة المحلية المبتكرة (CILG-VNG)", "tag_fr": "Institution", "tag_en": "Institution", "tag_ar": "مؤسسة", "def_fr": "Centre International de Développement pour la Gouvernance Locale Innovante, émanation de l'Association des Municipalités Néerlandaises (VNG), spécialisé dans la gouvernance locale, la décentralisation et le développement municipal dans les pays partenaires.", "def_en": "The International Centre for Innovative Local Governance, an affiliate of the Association of Netherlands Municipalities (VNG), specialising in local governance, decentralisation and municipal development in partner countries.", "def_ar": "مركز دولي للحوكمة المحلية المبتكرة، منبثق عن جمعية البلديات الهولندية (VNG)، متخصص في الحوكمة المحلية واللامركزية والتنمية البلدية في البلدان الشريكة."}, {"term_fr": "BIT / OIT", "term_en": "ILO (International Labour Organization)", "term_ar": "منظمة العمل الدولية ومكتبها الدولي", "tag_fr": "Institution onusienne", "tag_en": "UN agency", "tag_ar": "وكالة أممية", "def_fr": "Le Bureau International du Travail (BIT) est la branche exécutive/secrétariat de l'Organisation Internationale du Travail (OIT), institution tripartite des Nations Unies (gouvernements, employeurs, travailleurs) dont le mandat est la promotion du travail décent, des droits au travail et de la protection sociale.", "def_en": "The International Labour Office (ILO) is the executive arm/secretariat of the International Labour Organization, the UN's tripartite agency (governments, employers, workers) mandated to promote decent work, labour rights and social protection.", "def_ar": "المكتب الدولي للعمل هو الجهاز التنفيذي/الأمانة العامة لمنظمة العمل الدولية، وهي وكالة أممية ثلاثية الأطراف (حكومات، أصحاب عمل، عمال) تتمثل مهمتها في النهوض بالعمل اللائق وحقوق العمل والحماية الاجتماعية."}, {"term_fr": "CGDR", "term_en": "CGDR (Regional Development Commission)", "term_ar": "المندوبية العامة للتنمية الجهوية", "tag_fr": "Institution tunisienne", "tag_en": "Tunisian institution", "tag_ar": "مؤسسة تونسية", "def_fr": "Commissariat Général au Développement Régional : institution publique tunisienne chargée de la coordination et de la planification du développement régional, placée sous la tutelle du ministère en charge de l'Économie.", "def_en": "The Regional Development Commission: a Tunisian public institution responsible for coordinating and planning regional development, under the supervision of the ministry in charge of the economy.", "def_ar": "المندوبية العامة للتنمية الجهوية: مؤسسة عمومية تونسية مكلّفة بتنسيق التنمية الجهوية والتخطيط لها، تخضع لإشراف الوزارة المكلفة بالاقتصاد."}, {"term_fr": "ODR", "term_en": "RDO (Regional Development Office)", "term_ar": "مكتب التنمية الجهوية", "tag_fr": "Institution tunisienne", "tag_en": "Tunisian institution", "tag_ar": "مؤسسة تونسية", "def_fr": "Office de Développement Régional : structure publique tunisienne déployée au niveau régional pour coordonner et appuyer les initiatives de développement économique local.", "def_en": "Regional Development Office: a Tunisian public body deployed at regional level to coordinate and support local economic development initiatives.", "def_ar": "مكتب التنمية الجهوية: هيكل عمومي تونسي يتواجد على المستوى الجهوي لتنسيق مبادرات التنمية الاقتصادية المحلية ودعمها."}, {"term_fr": "ANETI", "term_en": "ANETI (National Employment Agency)", "term_ar": "الوكالة الوطنية للتشغيل والعمل المستقل", "tag_fr": "Institution tunisienne", "tag_en": "Tunisian institution", "tag_ar": "مؤسسة تونسية", "def_fr": "Agence Nationale pour l'Emploi et le Travail Indépendant : agence publique tunisienne gérant un réseau de bureaux de l'emploi et du travail indépendant (BETI) sur l'ensemble du territoire, principal opérateur public d'intermédiation sur le marché du travail.", "def_en": "National Agency for Employment and Self-Employment: a Tunisian public agency managing a nationwide network of employment and self-employment offices (BETI), the main public labour-market intermediation operator.", "def_ar": "الوكالة الوطنية للتشغيل والعمل المستقل: وكالة عمومية تونسية تسيّر شبكة من مكاتب التشغيل والعمل المستقل على كامل التراب الوطني، وهي المتدخل العمومي الرئيسي في الوساطة بسوق الشغل."}, {"term_fr": "ANPR", "term_en": "ANPR (National Research Promotion Agency)", "term_ar": "الوكالة الوطنية للنهوض بالبحث العلمي", "tag_fr": "Institution tunisienne", "tag_en": "Tunisian institution", "tag_ar": "مؤسسة تونسية", "def_fr": "Agence Nationale de Promotion de la Recherche : établissement public tunisien chargé de financer et de promouvoir la recherche scientifique et l'innovation.", "def_en": "National Research Promotion Agency: a Tunisian public body responsible for financing and promoting scientific research and innovation.", "def_ar": "الوكالة الوطنية للنهوض بالبحث العلمي: مؤسسة عمومية تونسية مكلّفة بتمويل البحث العلمي والابتكار والنهوض بهما."}, {"term_fr": "ONJ", "term_en": "National Youth Observatory", "term_ar": "المرصد الوطني للشباب", "tag_fr": "Institution tunisienne", "tag_en": "Tunisian institution", "tag_ar": "مؤسسة تونسية", "def_fr": "Observatoire National de la Jeunesse : structure publique tunisienne chargée de la collecte, de l'analyse et de la diffusion de données sur la situation de la jeunesse.", "def_en": "National Youth Observatory: a Tunisian public body responsible for collecting, analysing and disseminating data on the situation of young people.", "def_ar": "المرصد الوطني للشباب: هيكل عمومي تونسي مكلّف بجمع البيانات المتعلقة بوضعية الشباب وتحليلها ونشرها."}, {"term_fr": "MEP", "term_en": "Ministry of Economy and Planning", "term_ar": "وزارة الاقتصاد والتخطيط", "tag_fr": "Institution tunisienne", "tag_en": "Tunisian institution", "tag_ar": "مؤسسة تونسية", "def_fr": "Ministère de l'Économie et de la Planification : département ministériel tunisien en charge de la politique économique nationale et de la planification du développement.", "def_en": "Ministry of Economy and Planning: the Tunisian ministerial department in charge of national economic policy and development planning.", "def_ar": "وزارة الاقتصاد والتخطيط: قطاع وزاري تونسي مكلّف بالسياسة الاقتصادية الوطنية والتخطيط التنموي."}, {"term_fr": "MJS", "term_en": "Ministry of Youth and Sports Affairs", "term_ar": "وزارة الشباب والرياضة", "tag_fr": "Institution tunisienne", "tag_en": "Tunisian institution", "tag_ar": "مؤسسة تونسية", "def_fr": "Ministère des Affaires de la Jeunesse et des Sports : département ministériel tunisien en charge des politiques publiques relatives à la jeunesse et au sport.", "def_en": "Ministry of Youth and Sports Affairs: the Tunisian ministerial department in charge of public policy on youth and sport.", "def_ar": "وزارة الشباب والرياضة: قطاع وزاري تونسي مكلّف بالسياسات العمومية المتعلقة بالشباب والرياضة."}, {"term_fr": "AECID", "term_en": "AECID (Spanish Agency for International Development Cooperation)", "term_ar": "الوكالة الإسبانية للتعاون الدولي من أجل التنمية", "tag_fr": "Institution", "tag_en": "Institution", "tag_ar": "مؤسسة", "def_fr": "Agence Espagnole pour la Coopération Internationale au Développement : organisme public espagnol chargé de la mise en œuvre de la politique de coopération internationale de l'Espagne.", "def_en": "Spanish Agency for International Development Cooperation: a Spanish public body responsible for implementing Spain's international cooperation policy.", "def_ar": "الوكالة الإسبانية للتعاون الدولي من أجل التنمية: هيئة عمومية إسبانية مكلّفة بتنفيذ سياسة التعاون الدولي لإسبانيا."}, {"term_fr": "EUNIC", "term_en": "EUNIC (European Union National Institutes for Culture)", "term_ar": "شبكة المعاهد الثقافية الوطنية للاتحاد الأوروبي", "tag_fr": "Réseau", "tag_en": "Network", "tag_ar": "شبكة", "def_fr": "Réseau des Instituts Culturels Nationaux de l'Union Européenne, regroupant les agences culturelles officielles des États membres afin de promouvoir la coopération culturelle européenne dans les pays tiers.", "def_en": "The network of European Union National Institutes for Culture, bringing together the official cultural agencies of member states to promote European cultural cooperation in third countries.", "def_ar": "شبكة المعاهد الثقافية الوطنية للاتحاد الأوروبي، تجمع الوكالات الثقافية الرسمية للدول الأعضاء بهدف تعزيز التعاون الثقافي الأوروبي في البلدان الثالثة."}]}, {"id": "financement", "label_fr": "Financement & gestion de projet", "label_en": "Financing & Project Management", "label_ar": "التمويل وإدارة المشاريع", "color": "#D85A30", "terms": [{"term_fr": "Appel à propositions (AAP)", "term_en": "Call for proposals", "term_ar": "دعوة لتقديم المشاريع", "tag_fr": "Mécanisme", "tag_en": "Mechanism", "tag_ar": "آلية", "def_fr": "Mécanisme de mise en compétition ouverte permettant à des organisations de soumettre des projets susceptibles de recevoir un financement, selon des critères d'éligibilité, de sélection et d'attribution précis. Le mode de distribution de fonds le plus courant dans la coopération internationale.", "def_en": "An open competitive mechanism allowing organisations to submit projects for potential funding, based on defined eligibility, selection and award criteria. The most common method of distributing funds in international cooperation.", "def_ar": "آلية تنافس مفتوحة تتيح للمنظمات تقديم مشاريع قابلة للحصول على تمويل، وفق معايير دقيقة للأهلية والانتقاء والإسناد، وهي الطريقة الأكثر شيوعًا لتوزيع الأموال في مجال التعاون الدولي."}, {"term_fr": "Subvention", "term_en": "Grant", "term_ar": "المنحة", "tag_fr": "Instrument financier", "tag_en": "Financial instrument", "tag_ar": "أداة مالية", "def_fr": "Transfert financier à caractère non remboursable accordé à une organisation pour la mise en œuvre d'un projet ou d'une action spécifique, sous conditions d'éligibilité et de justification de l'utilisation des fonds. Elle se distingue du prêt (remboursable) et de l'investissement en capital.", "def_en": "A non-repayable financial transfer granted to an organisation for the implementation of a specific project or action, subject to eligibility conditions and justification of fund use. It differs from a loan (repayable) and from equity investment.", "def_ar": "تحويل مالي غير قابل للاسترداد يُمنح لمؤسسة ما لتنفيذ مشروع أو نشاط محدد، وفق شروط الأهلية ووجوب تبرير استخدام الأموال. وتختلف المنحة عن القرض (القابل للاسترداد) وعن الاستثمار في رأس المال."}, {"term_fr": "Reporting / rapport d'activité", "term_en": "Reporting / activity report", "term_ar": "التقرير / تقرير النشاط", "tag_fr": "Outil de gestion", "tag_en": "Management tool", "tag_ar": "أداة تدبيرية", "def_fr": "Document produit régulièrement par un porteur de projet pour rendre compte à son bailleur de l'avancement des activités, des résultats atteints et de l'utilisation des fonds. Le principal outil de redevabilité dans la gestion de projets de coopération.", "def_en": "A document produced regularly by a project holder to report to its funder on the progress of activities, results achieved and use of funds. The main accountability tool in cooperation project management.", "def_ar": "وثيقة يعدّها منجز المشروع بانتظام لتقديم حساب للجهة المانحة عن تقدم الأنشطة والنتائج المحققة واستخدام الأموال، وتُعد الأداة الرئيسية للمساءلة في تسيير مشاريع التعاون."}, {"term_fr": "Décaissement", "term_en": "Disbursement", "term_ar": "الصرف", "tag_fr": "Gestion financière", "tag_en": "Financial management", "tag_ar": "التدبير المالي", "def_fr": "Versement effectif de fonds par un bailleur à un bénéficiaire, généralement conditionné à la justification des dépenses passées et à l'atteinte de jalons prédéfinis, selon un calendrier défini dans la convention de financement.", "def_en": "The actual transfer of funds from a donor to a beneficiary, generally conditional on the justification of past expenditure and the achievement of predefined milestones, following a schedule set out in the financing agreement.", "def_ar": "الدفع الفعلي للأموال من الجهة المانحة إلى المستفيد، ويكون عادة مشروطًا بتبرير النفقات السابقة وبلوغ محطات محددة مسبقًا، وفق جدول زمني يُحدَّد في اتفاقية التمويل."}, {"term_fr": "Audit", "term_en": "Audit", "term_ar": "التدقيق", "tag_fr": "Contrôle", "tag_en": "Control", "tag_ar": "رقابة", "def_fr": "Examen indépendant et systématique des comptes, des procédures et des activités d'une organisation ou d'un projet, visant à vérifier la conformité des dépenses avec les règles financières et la réalité des activités rapportées.", "def_en": "An independent and systematic examination of an organisation's or project's accounts, procedures and activities, aimed at verifying that expenditure complies with financial rules and that reported activities are accurate.", "def_ar": "فحص مستقل ومنهجي لحسابات مؤسسة أو مشروع ما وإجراءاته وأنشطته، يهدف إلى التحقق من مطابقة النفقات للقواعد المالية ومن واقعية الأنشطة المُبلغ عنها."}, {"term_fr": "Visibilité (règles de visibilité)", "term_en": "Visibility (donor visibility rules)", "term_ar": "قواعد إبراز الهوية البصرية للممول", "tag_fr": "Communication", "tag_en": "Communication", "tag_ar": "تواصل", "def_fr": "Ensemble des obligations contractuelles imposées aux projets financés par un bailleur pour assurer la reconnaissance publique du financement : utilisation des logos, mentions sur les supports de communication, événements de lancement. Une condition de transparence et de redevabilité publique.", "def_en": "The set of contractual obligations imposed on donor-funded projects to ensure public recognition of the funding: use of logos, mentions on communication materials, launch events. A condition for transparency and public accountability.", "def_ar": "مجموعة الالتزامات التعاقدية المفروضة على المشاريع الممولة لضمان الاعتراف العلني بالتمويل: استخدام الشعارات، الإشارة إلى الممول في وسائل التواصل، تنظيم فعاليات الانطلاق، وهي شرط للشفافية والمساءلة العمومية."}, {"term_fr": "Gestion axée sur les résultats (GAR)", "term_en": "Results-based management (RBM)", "term_ar": "الإدارة القائمة على النتائج", "tag_fr": "Méthode", "tag_en": "Method", "tag_ar": "منهجية", "def_fr": "Approche de management qui structure la planification, le suivi et la redevabilité autour des résultats attendus plutôt que des activités réalisées, déplaçant le focus de la gestion de « ce qu'on fait » vers « ce qu'on change ».", "def_en": "A management approach that structures planning, monitoring and accountability around expected results rather than activities carried out, shifting the management focus from \"what is done\" to \"what is changed\".", "def_ar": "مقاربة تدبيرية تنظّم التخطيط والمتابعة والمساءلة حول النتائج المرتقبة عوضًا عن الأنشطة المنجزة، وتنقل محور التدبير من «ما الذي يُنجز» إلى «ما الذي يتغيّر»."}]}];

const UI = {
  fr: { subtitle: "Définitions internationales et officielles reconnues des termes et acronymes de la coopération, du développement et des politiques jeunesse.",
        placeholder: "Rechercher un terme...", terms: "termes", themes: "thématiques", all: "Tout", empty: "Aucun terme ne correspond à votre recherche." },
  en: { subtitle: "Internationally recognised, official definitions of the terms and acronyms used in cooperation, development and youth policy.",
        placeholder: "Search a term...", terms: "terms", themes: "themes", all: "All", empty: "No term matches your search." },
  ar: { subtitle: "تعاريف دولية ورسمية معتمدة للمصطلحات والاختصارات المستخدمة في مجال التعاون والتنمية والسياسات الموجهة للشباب.",
        placeholder: "ابحث عن مصطلح...", terms: "مصطلح", themes: "مواضيع", all: "الكل", empty: "لا يوجد مصطلح مطابق لبحثك." }
};

let currentLang = 'fr';
let activeSection = 'all';

function setLang(lang){
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang===lang));
  document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = lang;
  document.getElementById('pageSubtitle').textContent = UI[lang].subtitle;
  document.getElementById('searchInput').placeholder = UI[lang].placeholder;
  document.getElementById('termsLabel').textContent = UI[lang].terms;
  document.getElementById('themesLabel').textContent = UI[lang].themes;
  document.getElementById('searchInput').value = '';
  buildTabs();
  render();
}

function buildTabs(){
  const nav = document.getElementById('navTabs');
  nav.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'tab-btn' + (activeSection==='all' ? ' active' : '');
  allBtn.textContent = UI[currentLang].all;
  allBtn.onclick = () => { activeSection='all'; buildTabs(); render(); };
  nav.appendChild(allBtn);
  DATA.forEach(sec => {
    const b = document.createElement('button');
    b.className = 'tab-btn' + (activeSection===sec.id ? ' active' : '');
    b.textContent = sec['label_'+currentLang];
    b.onclick = () => { activeSection = sec.id; buildTabs(); render(); };
    nav.appendChild(b);
  });
}

function render(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const root = document.getElementById('glossContent');
  root.innerHTML = '';
  let visible = 0;

  DATA.forEach(sec => {
    if (activeSection !== 'all' && activeSection !== sec.id) return;
    const matchingTerms = sec.terms.filter(term => {
      if (!q) return true;
      const hay = (term['term_'+currentLang] + ' ' + term['def_'+currentLang] + ' ' + term['tag_'+currentLang]).toLowerCase();
      return hay.includes(q);
    });
    if (matchingTerms.length === 0) return;

    visible += matchingTerms.length;

    const block = document.createElement('div');
    block.className = 'section-block';

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `<span class="section-dot" style="background:${sec.color}"></span>
      <h2>${sec['label_'+currentLang]}</h2>
      <span class="section-count">${matchingTerms.length}</span>`;
    block.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'entries-grid';

    matchingTerms.forEach((term, idx) => {
      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.innerHTML = `
        <div class="entry-head">
          <span class="entry-term">${term['term_'+currentLang]}</span>
          <span class="entry-tag">${term['tag_'+currentLang]}</span>
          <span class="entry-arrow">${currentLang==='ar' ? '‹' : '›'}</span>
        </div>
        <div class="entry-body">
          <p class="entry-def">${term['def_'+currentLang]}</p>
        </div>`;
      entry.onclick = () => entry.classList.toggle('open');
      grid.appendChild(entry);
    });

    block.appendChild(grid);
    root.appendChild(block);
  });

  document.getElementById('visibleCount').textContent = visible;

  if (visible === 0){
    root.innerHTML = `<div class="empty-state">${UI[currentLang].empty}</div>`;
  }
}

function filterGloss(){ render(); }

buildTabs();
render();
</script>
</body>
</html>
