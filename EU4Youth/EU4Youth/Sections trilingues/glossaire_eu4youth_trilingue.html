<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glossaire EU4Youth — FR / EN / AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f7; --surface-1:#f3f1ed; --surface-2:#ffffff;
  --border:#e6e2da; --border-strong:#d8d2c5;
  --text-primary:#241f16; --text-secondary:#5b5546; --text-muted:#948d7c;
  --accent:#b5652b; --accent-soft:#f1e3d6;
  --radius:10px; --font-sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-ar:'Noto Sans Arabic','Inter',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17140f; --surface-1:#211d16; --surface-2:#1c1912;
    --border:#332d20; --border-strong:#453d29;
    --text-primary:#f2ede2; --text-secondary:#c9c1af; --text-muted:#8b8471;
    --accent:#e5943f; --accent-soft:#3a2c1a;
  }
}
:root[data-theme="dark"]{
  --bg:#17140f; --surface-1:#211d16; --surface-2:#1c1912;
  --border:#332d20; --border-strong:#453d29;
  --text-primary:#f2ede2; --text-secondary:#c9c1af; --text-muted:#8b8471;
  --accent:#e5943f; --accent-soft:#3a2c1a;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:var(--bg); color:var(--text-primary); font-family:var(--font-sans);}
body{padding:0 0 4rem;}
.wrap{max-width:880px; margin:0 auto; padding:0 1.25rem;}

.top-bar{
  position:sticky; top:0; z-index:20; background:var(--bg);
  border-bottom:1px solid var(--border); padding-top:1.5rem;
}
.gloss-header{padding-bottom:0.9rem;}
.gloss-header h1{font-size:22px; font-weight:700; margin-bottom:0.3rem; letter-spacing:-0.01em;}
.gloss-header p{font-size:13.5px; color:var(--text-secondary); line-height:1.5;}

.lang-switch{
  display:flex; gap:6px; margin:1rem 0 0.9rem;
}
.lang-btn{
  flex:1; padding:9px 6px; font-size:13px; font-weight:600;
  border:1px solid var(--border-strong); border-radius:8px;
  background:var(--surface-2); color:var(--text-secondary);
  cursor:pointer; transition:all .15s;
}
.lang-btn.active{background:var(--text-primary); color:var(--bg); border-color:var(--text-primary);}

.search-bar{margin:0 0 0.9rem; position:relative;}
.search-bar input{
  width:100%; padding:10px 14px 10px 38px; font-size:14px;
  border:1px solid var(--border-strong); border-radius:var(--radius);
  background:var(--surface-2); color:var(--text-primary); outline:none;
}
.search-bar input:focus{border-color:var(--accent);}
.search-bar svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.55; width:16px; height:16px;}
[dir="rtl"] .search-bar input{padding:10px 38px 10px 14px;}
[dir="rtl"] .search-bar svg{left:auto; right:12px;}

.stats-row{display:flex; gap:8px; margin-bottom:0.9rem; flex-wrap:wrap;}
.stat-pill{font-size:11.5px; padding:4px 11px; background:var(--surface-1); border:1px solid var(--border); border-radius:20px; color:var(--text-secondary);}
.stat-pill b{font-weight:700; color:var(--text-primary);}

.nav-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:1rem; scrollbar-width:none;}
.nav-tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  flex-shrink:0; padding:6px 13px; font-size:12px; font-weight:500;
  border:1px solid var(--border); border-radius:20px; background:var(--surface-2);
  color:var(--text-secondary); cursor:pointer; white-space:nowrap; transition:all .15s;
}
.tab-btn:hover{border-color:var(--border-strong); color:var(--text-primary);}
.tab-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}

.content{padding-top:1.25rem;}
.section-block{margin-bottom:1.75rem;}
.section-block.hidden{display:none;}
.section-header{display:flex; align-items:center; gap:9px; padding:0 0 0.7rem; border-bottom:1px solid var(--border); margin-bottom:0.7rem;}
.section-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
.section-header h2{font-size:15px; font-weight:700;}
.section-count{margin-inline-start:auto; font-size:11px; color:var(--text-muted); background:var(--surface-1); border:1px solid var(--border); border-radius:20px; padding:2px 9px;}

.entries-grid{display:flex; flex-direction:column; gap:0;}
.entry{padding:0.8rem 0; border-bottom:1px solid var(--border); cursor:pointer;}
.entry:last-child{border-bottom:none;}
.entry-head{display:flex; align-items:center; gap:9px;}
.entry-term{font-size:14.5px; font-weight:600; color:var(--text-primary);}
.entry-tag{font-size:10px; padding:2px 8px; border-radius:20px; margin-inline-start:auto; flex-shrink:0; background:var(--accent-soft); color:var(--accent); white-space:nowrap;}
.entry-arrow{font-size:13px; color:var(--text-muted); transition:transform .2s; flex-shrink:0;}
.entry.open .entry-arrow{transform:rotate(90deg);}
[dir="rtl"] .entry.open .entry-arrow{transform:rotate(-90deg);}
.entry-body{display:none; padding-top:0.55rem;}
.entry.open .entry-body{display:block;}
.entry-def{font-size:13.3px; color:var(--text-secondary); line-height:1.7;}

.empty-state{padding:2.5rem 0; text-align:center; color:var(--text-muted); font-size:14px;}

/* RTL adaptation for Arabic */
body[dir="rtl"]{font-family:var(--font-ar); direction:rtl;}
body[dir="rtl"] .entry-tag{margin-inline-start:auto;}
body[dir="rtl"] .section-count{margin-inline-start:auto;}
</style>
</head>

<script>
const DATA = [{"id": "programme", "label_fr": "Cadres de programmation de l'UE", "label_en": "EU Programming Frameworks", "label_ar": "أطر البرمجة لدى الاتحاد الأوروبي", "color": "#1D9E75", "terms": [{"term_fr": "EU4Youth", "term_en": "EU4Youth", "term_ar": "برنامج EU4Youth", "tag_fr": "Programme", "tag_en": "Programme", "tag_ar": "برنامج", "def_fr": "Programme-cadre de coopération de l'Union européenne, doté d'un budget de 60 millions d'euros pour la période 2019–2027, réunissant six projets complémentaires organisés autour de trois objectifs : l'emploi et l'entrepreneuriat, la culture et le sport, et les politiques publiques pour la jeunesse.", "def_en": "A European Union cooperation framework programme, with a budget of €60 million for the period 2019–2027, bringing together six complementary projects organised around three objectives: employment and entrepreneurship, culture and sport, and youth public policy.", "def_ar": "برنامج إطاري للتعاون تابع للاتحاد الأوروبي، بميزانية قدرها 60 مليون يورو للفترة 2019–2027، يجمع ستة مشاريع متكاملة منظّمة حول ثلاثة أهداف: التشغيل وريادة الأعمال، والثقافة والرياضة، والسياسات العمومية الموجهة للشباب."}, {"term_fr": "Programme-cadre", "term_en": "Framework programme", "term_ar": "البرنامج الإطاري", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Mécanisme de financement et de coordination qui regroupe plusieurs projets distincts sous une vision commune et des principes d'intervention partagés. Le programme-cadre fixe les objectifs globaux et la gouvernance d'ensemble, tandis que chaque projet dispose de son propre budget, de son partenaire de mise en œuvre et de son périmètre d'action.", "def_en": "A financing and coordination mechanism that brings together several distinct projects under a shared vision and common intervention principles. The framework programme sets overall objectives and governance arrangements, while each project has its own budget, implementing partner and scope of action.", "def_ar": "آلية تمويل وتنسيق تجمع عدة مشاريع متمايزة ضمن رؤية مشتركة ومبادئ تدخل موحدة. يحدد البرنامج الإطاري الأهداف الشاملة والحوكمة العامة، في حين يمتلك كل مشروع ميزانيته الخاصة وشريك التنفيذ الخاص به ومجال عمله المحدد."}, {"term_fr": "Convention de financement", "term_en": "Financing agreement", "term_ar": "اتفاقية التمويل", "tag_fr": "Juridique", "tag_en": "Legal", "tag_ar": "قانوني", "def_fr": "Accord juridique signé entre un bailleur (par exemple la Commission européenne) et un gouvernement bénéficiaire, formalisant les engagements des deux parties sur le budget, la durée, les objectifs et les conditions de mise en œuvre d'un programme de coopération. Elle constitue la base contractuelle de tout programme d'aide extérieure.", "def_en": "A legal agreement signed between a donor (for example the European Commission) and a beneficiary government, formalising both parties' commitments regarding the budget, duration, objectives and implementation conditions of a cooperation programme. It forms the contractual basis of any external assistance programme.", "def_ar": "اتفاق قانوني يُبرم بين جهة مانحة (كالمفوضية الأوروبية مثلاً) وحكومة مستفيدة، يُضفي طابعًا رسميًا على التزامات الطرفين فيما يخص الميزانية والمدة والأهداف وشروط تنفيذ برنامج التعاون. تشكّل هذه الاتفاقية الأساس التعاقدي لأي برنامج مساعدة خارجية."}, {"term_fr": "Composante", "term_en": "Component", "term_ar": "المكوّن", "tag_fr": "Architecture", "tag_en": "Structure", "tag_ar": "هيكلة", "def_fr": "Subdivision thématique d'un programme regroupant un ou plusieurs projets autour d'un objectif spécifique commun. La composante constitue un niveau intermédiaire entre le programme-cadre et le projet.", "def_en": "A thematic subdivision of a programme grouping one or more projects around a shared specific objective. The component is an intermediate level between the framework programme and the individual project.", "def_ar": "تقسيم موضوعي داخل برنامج يجمع مشروعًا واحدًا أو أكثر حول هدف نوعي مشترك. يمثّل المكوّن مستوى وسيطًا بين البرنامج الإطاري والمشروع."}, {"term_fr": "Objectif spécifique (OS)", "term_en": "Specific objective (SO)", "term_ar": "الهدف النوعي", "tag_fr": "Logique d'intervention", "tag_en": "Intervention logic", "tag_ar": "منطق التدخل", "def_fr": "Résultat de niveau intermédiaire qu'un programme cherche à atteindre, plus concret que l'objectif global et directement mesurable. L'objectif spécifique délimite le périmètre d'une composante et structure les résultats attendus.", "def_en": "An intermediate-level result that a programme seeks to achieve, more concrete than the overall objective and directly measurable. The specific objective defines the scope of a component and structures its expected results.", "def_ar": "نتيجة على مستوى وسيط يسعى البرنامج إلى تحقيقها، وهي أكثر تحديدًا من الهدف العام وقابلة للقياس المباشر. يحدد الهدف النوعي مجال المكوّن وينظّم النتائج المرتقبة."}, {"term_fr": "Partenaire de mise en œuvre", "term_en": "Implementing partner", "term_ar": "شريك التنفيذ", "tag_fr": "Acteur", "tag_en": "Actor", "tag_ar": "فاعل", "def_fr": "Organisation — internationale, nationale ou de la société civile — chargée de la gestion opérationnelle d'un projet. Elle signe un contrat ou un accord de subvention avec le bailleur et est responsable de l'atteinte des résultats, de la gestion financière et du reporting.", "def_en": "An organisation — international, national or civil-society — responsible for the operational management of a project. It signs a contract or grant agreement with the donor and is accountable for achieving results, financial management and reporting.", "def_ar": "منظمة — دولية أو وطنية أو من منظمات المجتمع المدني — مكلّفة بالإدارة التنفيذية لمشروع ما. توقّع عقدًا أو اتفاقية منحة مع الجهة المانحة وتكون مسؤولة عن تحقيق النتائج والإدارة المالية وتقديم التقارير."}, {"term_fr": "Avenant", "term_en": "Amendment / Addendum", "term_ar": "الملحق التعديلي", "tag_fr": "Juridique", "tag_en": "Legal", "tag_ar": "قانوني", "def_fr": "Modification formelle apportée à un accord ou contrat existant, permettant d'en ajuster certains éléments (durée, budget, objectifs) sans rédiger un nouveau document contractuel. L'avenant doit être signé par toutes les parties originelles.", "def_en": "A formal modification made to an existing agreement or contract, allowing certain elements (duration, budget, objectives) to be adjusted without drafting a new contractual document. It must be signed by all original parties.", "def_ar": "تعديل رسمي يُدخل على اتفاق أو عقد قائم، يتيح تعديل بعض عناصره (المدة، الميزانية، الأهداف) دون تحرير وثيقة تعاقدية جديدة. ويجب أن يوقّعه جميع الأطراف الأصليين للاتفاق."}, {"term_fr": "Cadre de coopération bilatérale", "term_en": "Bilateral cooperation framework", "term_ar": "إطار التعاون الثنائي", "tag_fr": "Cadre politique", "tag_en": "Policy framework", "tag_ar": "إطار سياسي", "def_fr": "Accord ou déclaration conjointe entre deux États (ou un État et une organisation internationale) fixant les grandes orientations, priorités et principes de leur coopération dans un ou plusieurs domaines donnés, sur une période déterminée.", "def_en": "A joint agreement or declaration between two states (or a state and an international organisation) setting out the broad orientations, priorities and principles of their cooperation in one or more given fields, over a defined period.", "def_ar": "اتفاق أو إعلان مشترك بين دولتين (أو دولة ومنظمة دولية) يحدد التوجهات الكبرى والأولويات ومبادئ التعاون بينهما في مجال أو أكثر، خلال فترة زمنية محددة."}]}, {"id": "projets", "label_fr": "Repères des six projets", "label_en": "The Six Projects — Key Facts", "label_ar": "معطيات حول المشاريع الستة", "color": "#378ADD", "terms": [{"term_fr": "Fe3il.a", "term_en": "Fe3il.a", "term_ar": "فعيلة", "tag_fr": "Projet", "tag_en": "Project", "tag_ar": "مشروع", "def_fr": "Nom, en arabe dialectal tunisien, signifiant « il/elle agit ». Projet mis en œuvre par CILG-VNG International, portant sur l'intégration des jeunes dans la conception et la mise en œuvre des politiques publiques, aux niveaux local et national.", "def_en": "A name in Tunisian dialectal Arabic meaning \"he/she acts\". A project implemented by CILG-VNG International, focused on integrating young people into the design and implementation of public policy, at local and national level.", "def_ar": "اسم بالعامية التونسية يعني «هو/هي يفعل». مشروع تنفّذه منظمة CILG-VNG الدولية، يُعنى بإدماج الشباب في تصميم السياسات العمومية وتنفيذها على المستويين المحلي والوطني."}, {"term_fr": "Irada4Youth", "term_en": "Irada4Youth", "term_ar": "إرادة فور يوث", "tag_fr": "Projet", "tag_en": "Project", "tag_ar": "مشروع", "def_fr": "Extension ciblée du programme IRADA, mise en œuvre par le CGDR et les Offices de Développement Régional (ODRs), soutenant des projets économiques créateurs d'emploi pour les jeunes dans des gouvernorats prioritaires.", "def_en": "A targeted extension of the IRADA programme, implemented by the CGDR and the Regional Development Offices (ODRs), supporting job-creating economic projects for young people in priority governorates.", "def_ar": "امتداد موجّه لبرنامج إرادة، ينفّذه المندوبية العامة للتنمية الجهوية ومكاتب التنمية الجهوية، ويدعم مشاريع اقتصادية مُحدثة لمواطن الشغل لفائدة الشباب في ولايات ذات أولوية."}, {"term_fr": "Go4Youth", "term_en": "Go4Youth", "term_ar": "غو فور يوث", "tag_fr": "Projet", "tag_en": "Project", "tag_ar": "مشروع", "def_fr": "Nom signifiant « Gates for Opportunities ». Projet mis en œuvre par la Banque mondiale et l'ANETI, visant à moderniser les services publics d'intermédiation sur le marché du travail, notamment par la transformation numérique.", "def_en": "A name meaning \"Gates for Opportunities\". A project implemented by the World Bank and ANETI, aiming to modernise public labour-market intermediation services, notably through digital transformation.", "def_ar": "اسمه يعني «بوابات للفرص». مشروع تنفّذه البنك الدولي والوكالة الوطنية للتشغيل والعمل المستقل، يهدف إلى تحديث الخدمات العمومية للوساطة في سوق الشغل، لا سيما عبر التحول الرقمي."}, {"term_fr": "Jeun'ESS", "term_en": "Jeun'ESS", "term_ar": "جون إس إس", "tag_fr": "Projet", "tag_en": "Project", "tag_ar": "مشروع", "def_fr": "Projet mis en œuvre par le BIT/OIT, ciblant le développement de l'économie sociale et solidaire (ESS) comme vecteur d'emploi et d'inclusion pour les jeunes, à travers des mécanismes de financement et d'accompagnement dédiés.", "def_en": "A project implemented by the ILO, targeting the development of the social and solidarity economy (SSE) as a vehicle for youth employment and inclusion, through dedicated financing and support mechanisms.", "def_ar": "مشروع تنفّذه منظمة العمل الدولية، يستهدف تطوير الاقتصاد الاجتماعي والتضامني كرافعة للتشغيل والإدماج لفائدة الشباب، عبر آليات تمويل ومرافقة مخصّصة."}, {"term_fr": "SWAFY", "term_en": "SWAFY", "term_ar": "سوافي", "tag_fr": "Projet", "tag_en": "Project", "tag_ar": "مشروع", "def_fr": "Nom signifiant « Science With and For Youth ». Projet mis en œuvre par l'ANPR, soutenant l'employabilité des jeunes chercheurs via des bourses de recherche partenariale, la culture scientifique et le dialogue jeunesse-science.", "def_en": "A name meaning \"Science With and For Youth\". A project implemented by ANPR, supporting the employability of young researchers through partnership research grants, scientific culture and youth–science dialogue.", "def_ar": "اسمه يعني «العلم مع الشباب ومن أجله». مشروع تنفّذه الوكالة الوطنية للنهوض بالبحث العلمي، يدعم قابلية تشغيل الباحثين الشبان عبر منح بحث شراكي، ونشر الثقافة العلمية، وحوار الشباب والعلوم."}, {"term_fr": "Maghroum'IN", "term_en": "Maghroum'IN", "term_ar": "مغروم إن", "tag_fr": "Projet", "tag_en": "Project", "tag_ar": "مشروع", "def_fr": "Nom évoquant l'aspiration en arabe tunisien. Projet mis en œuvre par un consortium (AECID, FIIAPP, British Council), portant sur le renforcement de l'inclusion des jeunes vulnérables par la culture et le sport.", "def_en": "A name evoking aspiration in Tunisian Arabic. A project implemented by a consortium (AECID, FIIAPP, British Council), focused on strengthening the inclusion of vulnerable young people through culture and sport.", "def_ar": "اسم يوحي بالطموح بالعامية التونسية. مشروع ينفّذه ائتلاف يضم الوكالة الإسبانية للتعاون الدولي من أجل التنمية ومؤسسة FIIAPP والمجلس الثقافي البريطاني، يُعنى بتعزيز إدماج الشباب في وضعية هشاشة عبر الثقافة والرياضة."}, {"term_fr": "Tfanen", "term_en": "Tfanen", "term_ar": "تفنن", "tag_fr": "Programme", "tag_en": "Programme", "tag_ar": "برنامج", "def_fr": "Programme antérieur d'appui à la culture, ayant financé plus de 70 actions culturelles à travers des appels à projets réguliers, mobilisant des associations et des jeunes sur l'ensemble du territoire.", "def_en": "An earlier cultural support programme that funded more than 70 cultural initiatives through regular calls for projects, mobilising associations and young people nationwide.", "def_ar": "برنامج سابق لدعم الثقافة، موّل أكثر من 70 نشاطًا ثقافيًا عبر دعوات دورية لتقديم المشاريع، وحرّك جمعيات وشبابًا على كامل التراب الوطني."}]}, {"id": "cooperation", "label_fr": "Coopération internationale", "label_en": "International Cooperation", "label_ar": "التعاون الدولي", "color": "#534AB7", "terms": [{"term_fr": "Coopération internationale au développement", "term_en": "International development cooperation", "term_ar": "التعاون الدولي من أجل التنمية", "tag_fr": "Fondamental", "tag_en": "Core concept", "tag_ar": "مفهوم أساسي", "def_fr": "Ensemble des mécanismes par lesquels des États, des organisations internationales ou des institutions supranationales mobilisent des ressources financières, techniques et humaines pour soutenir le développement économique, social et humain de pays partenaires, sur la base du principe de partenariat.", "def_en": "The set of mechanisms through which states, international organisations or supranational institutions mobilise financial, technical and human resources to support the economic, social and human development of partner countries, based on the principle of partnership.", "def_ar": "مجموع الآليات التي تعبّئ من خلالها الدول والمنظمات الدولية أو المؤسسات فوق الوطنية موارد مالية وتقنية وبشرية لدعم التنمية الاقتصادية والاجتماعية والبشرية في البلدان الشريكة، استنادًا إلى مبدأ الشراكة."}, {"term_fr": "Aide publique au développement (APD)", "term_en": "Official development assistance (ODA)", "term_ar": "المساعدة الإنمائية الرسمية", "tag_fr": "Fondamental", "tag_en": "Core concept", "tag_ar": "مفهوم أساسي", "def_fr": "Flux financiers fournis par des organismes publics à des pays en développement ou à des organisations multilatérales dans le but de promouvoir le développement économique et le bien-être, comptabilisés par l'OCDE selon des critères précis de concessionnalité.", "def_en": "Financial flows provided by official agencies to developing countries or multilateral organisations with the promotion of economic development and welfare as the main objective, recorded by the OECD according to defined concessionality criteria.", "def_ar": "تدفقات مالية تقدّمها هيئات رسمية إلى بلدان نامية أو منظمات متعددة الأطراف بهدف تعزيز التنمية الاقتصادية والرفاه، وتحتسبها منظمة التعاون والتنمية الاقتصادية وفق معايير دقيقة للتساهل."}, {"term_fr": "Logique de résultats / cadre logique", "term_en": "Results chain / logical framework", "term_ar": "سلسلة النتائج / الإطار المنطقي", "tag_fr": "Méthode", "tag_en": "Method", "tag_ar": "منهجية", "def_fr": "Approche méthodologique qui structure une intervention selon une hiérarchie causale : activités → extrants (outputs) → résultats (outcomes) → impact. Elle clarifie la chaîne de causalité entre ce qu'un programme fait et les changements qu'il cherche à produire, et sert de base au suivi-évaluation.", "def_en": "A methodological approach that structures an intervention according to a causal hierarchy: activities → outputs → outcomes → impact. It clarifies the causal chain between what a programme does and the changes it seeks to produce, and underpins monitoring and evaluation.", "def_ar": "منهجية تنظّم التدخل وفق تسلسل سببي: أنشطة ← مخرجات ← نتائج ← أثر. توضّح هذه السلسلة العلاقة السببية بين ما ينجزه البرنامج والتغييرات التي يسعى إلى إحداثها، وتشكّل أساس المتابعة والتقييم."}, {"term_fr": "Extrant (output)", "term_en": "Output", "term_ar": "المخرج", "tag_fr": "Logique de projet", "tag_en": "Project logic", "tag_ar": "منطق المشروع", "def_fr": "Produit direct d'une activité : formation dispensée, document produit, infrastructure réhabilitée, bourse accordée. L'extrant est immédiatement mesurable à l'issue d'une activité et se distingue du résultat (outcome), qui mesure le changement induit chez les bénéficiaires.", "def_en": "The direct product of an activity: a training delivered, a document produced, infrastructure rehabilitated, a grant awarded. An output is immediately measurable upon completion of an activity, and is distinct from an outcome, which measures the change induced among beneficiaries.", "def_ar": "المنتج المباشر لنشاط ما: تكوين مقدَّم، وثيقة منجزة، بنية تحتية مُعاد تأهيلها، منحة مسندة. يكون المخرج قابلاً للقياس فور انتهاء النشاط، ويختلف عن النتيجة التي تقيس التغيير الحاصل لدى المستفيدين."}, {"term_fr": "Résultat (outcome)", "term_en": "Outcome", "term_ar": "النتيجة", "tag_fr": "Logique de projet", "tag_en": "Project logic", "tag_ar": "منطق المشروع", "def_fr": "Changement observable dans le comportement, les capacités, les conditions ou le statut des bénéficiaires, induit par les activités d'une intervention. Le résultat est le niveau de mesure qui reflète l'effet réel d'une intervention sur les personnes ciblées.", "def_en": "An observable change in the behaviour, capacities, conditions or status of beneficiaries, brought about by an intervention's activities. Outcome is the level of measurement that reflects the actual effect of an intervention on the people targeted.", "def_ar": "تغيير قابل للملاحظة في سلوك المستفيدين أو قدراتهم أو أوضاعهم أو وضعيتهم، ناجم عن أنشطة التدخل. تمثّل النتيجة مستوى القياس الذي يعكس الأثر الفعلي للتدخل على الفئة المستهدفة."}, {"term_fr": "Impact", "term_en": "Impact", "term_ar": "الأثر", "tag_fr": "Logique de projet", "tag_en": "Project logic", "tag_ar": "منطق المشروع", "def_fr": "Changement de long terme dans la situation globale d'une population ou d'un système, partiellement attribuable à une intervention. L'impact est difficile à mesurer directement et s'observe sur le long terme, au-delà de la fin du financement.", "def_en": "A long-term change in the overall situation of a population or system, partly attributable to an intervention. Impact is difficult to measure directly and is observed over the long term, beyond the end of funding.", "def_ar": "تغيير بعيد المدى في الوضع العام لمجموعة سكانية أو منظومة ما، يُعزى جزئيًا إلى تدخل معيّن. يصعب قياس الأثر مباشرة ويُلاحظ على المدى الطويل، بعد انتهاء التمويل."}, {"term_fr": "Indicateur de performance", "term_en": "Performance indicator", "term_ar": "مؤشر الأداء", "tag_fr": "Suivi-évaluation", "tag_en": "Monitoring & evaluation", "tag_ar": "المتابعة والتقييم", "def_fr": "Mesure quantitative ou qualitative permettant d'apprécier le degré d'atteinte d'un objectif ou d'un résultat. Un bon indicateur est SMART : Spécifique, Mesurable, Atteignable, Réaliste et Temporellement défini.", "def_en": "A quantitative or qualitative measure used to assess the degree of achievement of an objective or result. A good indicator is SMART: Specific, Measurable, Achievable, Realistic and Time-bound.", "def_ar": "قياس كمي أو نوعي يتيح تقدير درجة بلوغ هدف أو نتيجة ما. يتميز المؤشر الجيد بخاصية SMART: محدد، قابل للقياس، قابل للتحقيق، واقعي، ومحدد زمنيًا."}, {"term_fr": "Évaluation à mi-parcours", "term_en": "Mid-term evaluation", "term_ar": "التقييم منتصف المدة", "tag_fr": "Suivi-évaluation", "tag_en": "Monitoring & evaluation", "tag_ar": "المتابعة والتقييم", "def_fr": "Évaluation indépendante conduite à la moitié de la durée d'un programme pour apprécier sa pertinence, son efficacité, son efficience, son impact attendu et sa durabilité, et produire des recommandations pour ajuster la mise en œuvre.", "def_en": "An independent evaluation conducted halfway through a programme's duration to assess its relevance, effectiveness, efficiency, expected impact and sustainability, and to produce recommendations for adjusting implementation.", "def_ar": "تقييم مستقل يُجرى في منتصف مدة البرنامج لتقدير مدى ملاءمته وفعاليته ونجاعته وأثره المتوقع واستدامته، وتقديم توصيات لتعديل التنفيذ."}, {"term_fr": "Durabilité (sustainability)", "term_en": "Sustainability", "term_ar": "الاستدامة", "tag_fr": "Concept clé", "tag_en": "Key concept", "tag_ar": "مفهوم أساسي", "def_fr": "Capacité des résultats et des changements produits par une intervention à se maintenir au-delà de la fin du financement extérieur, dépendant de l'appropriation institutionnelle, de la structuration des acteurs locaux et de la continuité des politiques publiques.", "def_en": "The ability of the results and changes produced by an intervention to be maintained beyond the end of external funding, depending on institutional ownership, the structuring of local actors and the continuity of public policies.", "def_ar": "قدرة النتائج والتغييرات الناتجة عن تدخل ما على الاستمرار بعد انتهاء التمويل الخارجي، وهي مرتبطة بالتملك المؤسساتي وتنظيم الفاعلين المحليين واستمرارية السياسات العمومية."}, {"term_fr": "Capitalisation", "term_en": "Knowledge capitalisation", "term_ar": "الرسملة المعرفية", "tag_fr": "Méthode", "tag_en": "Method", "tag_ar": "منهجية", "def_fr": "Processus systématique par lequel une intervention documente, analyse et diffuse les leçons tirées de ses expériences et pratiques, pour les rendre utiles à d'autres acteurs et alimenter les politiques publiques. Elle transforme l'expérience en connaissance partageable.", "def_en": "A systematic process through which an intervention documents, analyses and disseminates the lessons learned from its experiences and practices, to make them useful to other actors and inform public policy. It turns experience into shareable knowledge.", "def_ar": "عملية منهجية يوثّق من خلالها تدخل ما تجاربه وممارساته ويحلّلها وينشرها، بهدف الاستفادة منها من قبل فاعلين آخرين وإثراء السياسات العمومية. تحوّل هذه العملية التجربة إلى معرفة قابلة للتقاسم."}, {"term_fr": "Délégation de l'Union européenne (DUE)", "term_en": "Delegation of the European Union", "term_ar": "وفد الاتحاد الأوروبي", "tag_fr": "Acteur", "tag_en": "Actor", "tag_ar": "فاعل", "def_fr": "Représentation officielle de la Commission européenne dans un pays tiers, assurant la mise en œuvre de la politique extérieure de l'UE sur place : gestion des programmes de coopération, suivi de leur mise en œuvre et dialogue politique avec les autorités du pays partenaire.", "def_en": "The official representation of the European Commission in a third country, implementing EU external policy locally: managing cooperation programmes, monitoring their implementation and conducting political dialogue with partner-country authorities.", "def_ar": "التمثيل الرسمي للمفوضية الأوروبية في بلد ثالث، يتولى تنفيذ السياسة الخارجية للاتحاد الأوروبي محليًا: إدارة برامج التعاون، ومتابعة تنفيذها، والحوار السياسي مع سلطات البلد الشريك."}, {"term_fr": "Conditionnalité", "term_en": "Conditionality", "term_ar": "المشروطية", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Principe selon lequel le versement d'une aide ou le maintien d'un financement est subordonné au respect de certaines conditions par le bénéficiaire (réformes, critères économiques, atteinte de résultats). Elle peut être ex ante (avant versement) ou ex post (basée sur les résultats).", "def_en": "The principle whereby the disbursement of aid or the continuation of funding is made conditional on the beneficiary meeting certain conditions (reforms, economic criteria, achievement of results). It can be applied ex ante (before disbursement) or ex post (results-based).", "def_ar": "مبدأ يقضي بأن صرف المساعدة أو مواصلة التمويل مرهون باستيفاء الجهة المستفيدة شروطًا معينة (إصلاحات، معايير اقتصادية، بلوغ نتائج). ويمكن أن تكون المشروطية قبلية (قبل الصرف) أو بعدية (مبنية على النتائج)."}, {"term_fr": "Appropriation (ownership)", "term_en": "Ownership", "term_ar": "التملّك", "tag_fr": "Concept clé", "tag_en": "Key concept", "tag_ar": "مفهوم أساسي", "def_fr": "Principe selon lequel les pays et institutions bénéficiaires doivent exercer un contrôle et une responsabilité réels sur leurs stratégies de développement et sur les programmes qui les soutiennent. C'est une condition de la durabilité des résultats.", "def_en": "The principle that beneficiary countries and institutions must exercise real control and responsibility over their own development strategies and the programmes that support them. It is a condition for the sustainability of results.", "def_ar": "مبدأ يقضي بأن تمارس البلدان والمؤسسات المستفيدة سيطرة ومسؤولية حقيقيتين على استراتيجياتها التنموية والبرامج الداعمة لها. ويُعدّ شرطًا لاستدامة النتائج."}, {"term_fr": "Genre et développement (GED)", "term_en": "Gender and development (GAD)", "term_ar": "النوع الاجتماعي والتنمية", "tag_fr": "Approche", "tag_en": "Approach", "tag_ar": "مقاربة", "def_fr": "Approche qui intègre systématiquement l'analyse des rapports sociaux entre femmes et hommes dans les programmes de développement, reconnaissant que l'inégalité de genre est un obstacle structurel au développement, et qui interroge les systèmes produisant ces inégalités.", "def_en": "An approach that systematically integrates the analysis of social relations between women and men into development programmes, recognising gender inequality as a structural obstacle to development, and questioning the systems that produce these inequalities.", "def_ar": "مقاربة تدمج بشكل منهجي تحليل العلاقات الاجتماعية بين النساء والرجال ضمن برامج التنمية، وتقرّ بأن عدم المساواة بين الجنسين يشكّل عائقًا هيكليًا أمام التنمية، وتتساءل عن الأنظمة المنتِجة لهذه اللامساواة."}, {"term_fr": "Approche territoriale", "term_en": "Territorial/place-based approach", "term_ar": "المقاربة الترابية", "tag_fr": "Méthode", "tag_en": "Method", "tag_ar": "منهجية", "def_fr": "Modalité d'intervention qui prend en compte les spécificités géographiques, économiques et sociales d'un territoire donné, et qui mobilise les acteurs locaux plutôt que d'imposer des solutions standardisées définies de manière centralisée.", "def_en": "A mode of intervention that takes into account the geographic, economic and social specificities of a given territory, and mobilises local actors rather than imposing standardised, centrally-designed solutions.", "def_ar": "أسلوب تدخل يراعي الخصوصيات الجغرافية والاقتصادية والاجتماعية لمنطقة معينة، ويعتمد على تعبئة الفاعلين المحليين عوضًا عن فرض حلول موحّدة مُعدّة مركزيًا."}]}, {"id": "emploi", "label_fr": "Emploi & entrepreneuriat", "label_en": "Employment & Entrepreneurship", "label_ar": "التشغيل وريادة الأعمال", "color": "#BA7517", "terms": [{"term_fr": "Emploi décent", "term_en": "Decent work", "term_ar": "العمل اللائق", "tag_fr": "OIT", "tag_en": "ILO", "tag_ar": "منظمة العمل الدولية", "def_fr": "Concept développé par l'Organisation internationale du travail (OIT) désignant un travail productif générant un revenu équitable, assurant la sécurité du travailleur, garantissant une protection sociale, favorisant le développement personnel et l'intégration sociale, dans le respect de la non-discrimination et de la liberté d'expression au travail.", "def_en": "A concept developed by the International Labour Organization (ILO) denoting productive work that delivers a fair income, provides workplace security, guarantees social protection, fosters personal development and social integration, and upholds non-discrimination and freedom of expression at work.", "def_ar": "مفهوم وضعته منظمة العمل الدولية يشير إلى عمل منتج يوفّر دخلاً عادلاً، ويضمن الأمان للعامل، ويكفل الحماية الاجتماعية، ويعزّز التطور الشخصي والاندماج الاجتماعي، في ظل عدم التمييز وحرية التعبير في مكان العمل."}, {"term_fr": "Employabilité", "term_en": "Employability", "term_ar": "قابلية التشغيل", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Ensemble des compétences, connaissances, attitudes et attributs qui permettent à un individu d'accéder à un emploi, de s'y maintenir et d'évoluer professionnellement — combinant compétences techniques (hard skills) et compétences transversales (soft skills) comme la communication ou l'adaptabilité.", "def_en": "The set of skills, knowledge, attitudes and attributes that enable an individual to obtain a job, remain in employment and progress professionally — combining technical (hard) skills and transversal (soft) skills such as communication or adaptability.", "def_ar": "مجموع المهارات والمعارف والمواقف والسمات التي تمكّن الفرد من الحصول على عمل والبقاء فيه والتطور المهني، وتجمع بين المهارات التقنية والمهارات الناعمة كالتواصل والقدرة على التكيّف."}, {"term_fr": "NEET", "term_en": "NEET", "term_ar": "نيت (NEET)", "tag_fr": "Statistique", "tag_en": "Statistical category", "tag_ar": "فئة إحصائية", "def_fr": "Acronyme anglais de « Not in Education, Employment or Training », désignant les jeunes qui ne sont ni en emploi, ni en études, ni en formation. Catégorie statistique utilisée internationalement (OIT, Eurostat, OCDE) pour identifier le segment de jeunes le plus exposé au risque d'exclusion durable.", "def_en": "An acronym for \"Not in Education, Employment or Training\", designating young people who are neither employed nor in education or training. An internationally used statistical category (ILO, Eurostat, OECD) to identify the youth segment most exposed to the risk of lasting exclusion.", "def_ar": "اختصار إنجليزي يعني «لا يعمل ولا يدرس ولا يتكوّن»، ويشير إلى الشباب الذين ليسوا في وضعية تشغيل أو تعليم أو تكوين. فئة إحصائية معتمدة دوليًا (منظمة العمل الدولية، يوروستات، منظمة التعاون والتنمية) لتحديد شريحة الشباب الأكثر عرضة لخطر الإقصاء الدائم."}, {"term_fr": "Intermédiation sur le marché du travail", "term_en": "Labour market intermediation", "term_ar": "الوساطة في سوق الشغل", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Ensemble des activités visant à mettre en relation l'offre (les employeurs) et la demande (les chercheurs d'emploi) sur le marché du travail, assurées par des structures publiques (agences nationales pour l'emploi) ou privées (associations d'accompagnement, cabinets de recrutement).", "def_en": "The set of activities aimed at matching labour supply (employers) and demand (job seekers) on the labour market, carried out by public bodies (national employment agencies) or private ones (support associations, recruitment firms).", "def_ar": "مجموع الأنشطة التي تهدف إلى الربط بين العرض (أصحاب العمل) والطلب (الباحثين عن عمل) في سوق الشغل، تضطلع بها هياكل عمومية (وكالات وطنية للتشغيل) أو خاصة (جمعيات مرافقة، مكاتب توظيف)."}, {"term_fr": "Entrepreneuriat", "term_en": "Entrepreneurship", "term_ar": "ريادة الأعمال", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Démarche par laquelle un individu ou un collectif identifie une opportunité, mobilise des ressources et prend un risque calculé pour créer une activité économique nouvelle. On distingue l'entrepreneuriat individuel, l'entrepreneuriat social et l'entrepreneuriat collectif.", "def_en": "The process by which an individual or a group identifies an opportunity, mobilises resources and takes a calculated risk to create a new economic activity. Individual, social and collective entrepreneurship are commonly distinguished.", "def_ar": "مسار يحدد من خلاله فرد أو جماعة فرصة معينة، ويعبّئ الموارد، ويتحمّل مخاطرة محسوبة لإحداث نشاط اقتصادي جديد. ويُميَّز بين ريادة الأعمال الفردية والاجتماعية والجماعية."}, {"term_fr": "Entrepreneuriat social", "term_en": "Social entrepreneurship", "term_ar": "ريادة الأعمال الاجتماعية", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Forme d'entrepreneuriat qui poursuit une mission sociale, environnementale ou culturelle en utilisant les mécanismes du marché pour produire des changements positifs dans la société. L'entreprise sociale génère des revenus mais réinvestit ses excédents dans sa mission.", "def_en": "A form of entrepreneurship that pursues a social, environmental or cultural mission using market mechanisms to produce positive change in society. A social enterprise generates revenue but reinvests its surplus into its mission.", "def_ar": "شكل من أشكال ريادة الأعمال يسعى لتحقيق رسالة اجتماعية أو بيئية أو ثقافية باستخدام آليات السوق لإحداث تغيير إيجابي في المجتمع. تحقق المؤسسة الاجتماعية عائدات لكنها تعيد استثمار فائضها في خدمة رسالتها."}, {"term_fr": "Secteur informel", "term_en": "Informal sector", "term_ar": "القطاع غير المنظم", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Ensemble des activités économiques se déroulant en dehors du cadre légal et réglementaire : travailleurs sans contrat formel, activités non déclarées, absence de protection sociale — exposant les travailleurs concernés à une forte précarité.", "def_en": "The set of economic activities carried out outside the legal and regulatory framework: workers without a formal contract, undeclared activities, absence of social protection — exposing the workers concerned to significant precariousness.", "def_ar": "مجموع الأنشطة الاقتصادية التي تجري خارج الإطار القانوني والتنظيمي: عمال دون عقد رسمي، أنشطة غير مصرّح بها، وانعدام الحماية الاجتماعية، مما يعرّض العمال المعنيين لهشاشة كبيرة."}, {"term_fr": "Filière", "term_en": "Value chain / sector", "term_ar": "السلسلة القطاعية", "tag_fr": "Économie", "tag_en": "Economics", "tag_ar": "اقتصاد", "def_fr": "Chaîne de valeur sectorielle regroupant l'ensemble des acteurs économiques (producteurs, transformateurs, distributeurs, prestataires) intervenant dans la production et la mise en marché d'un produit ou service. L'approche filière analyse les interdépendances entre acteurs.", "def_en": "A sector-wide value chain bringing together all the economic actors (producers, processors, distributors, service providers) involved in producing and marketing a product or service. The value-chain approach analyses the interdependencies between actors.", "def_ar": "سلسلة قيمة قطاعية تجمع كافة الفاعلين الاقتصاديين (المنتجين، المحوّلين، الموزّعين، مقدّمي الخدمات) المتدخلين في إنتاج منتج أو خدمة وتسويقها. تحلّل مقاربة السلسلة القطاعية الترابط بين هؤلاء الفاعلين."}, {"term_fr": "Recherche partenariale", "term_en": "Partnership-based / collaborative research", "term_ar": "البحث الشراكي", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Mode de production de la recherche scientifique associant des chercheurs et des acteurs socioéconomiques (entreprises, associations, institutions) autour d'une problématique d'intérêt commun, visant à rapprocher la recherche académique des besoins du monde productif.", "def_en": "A mode of producing scientific research that involves researchers and socio-economic actors (businesses, associations, institutions) around a shared issue, aiming to bring academic research closer to the needs of the productive sector.", "def_ar": "نمط لإنتاج البحث العلمي يجمع الباحثين وفاعلين اقتصاديين واجتماعيين (مؤسسات، جمعيات، هياكل) حول إشكالية ذات اهتمام مشترك، بهدف تقريب البحث الأكاديمي من احتياجات القطاع الإنتاجي."}, {"term_fr": "Business plan / plan d'affaires", "term_en": "Business plan", "term_ar": "خطة العمل (بزنس بلان)", "tag_fr": "Outil", "tag_en": "Tool", "tag_ar": "أداة", "def_fr": "Document formalisé décrivant un projet entrepreneurial : modèle économique, analyse de marché, stratégie commerciale, plan financier, structure juridique et équipe. Il sert d'outil de planification interne et de support de communication vers les financeurs.", "def_en": "A formal document describing an entrepreneurial project: business model, market analysis, commercial strategy, financial plan, legal structure and team. It serves as both an internal planning tool and a communication document for financiers.", "def_ar": "وثيقة رسمية تصف مشروعًا ريادياً: النموذج الاقتصادي، تحليل السوق، الاستراتيجية التجارية، الخطة المالية، الهيكل القانوني والفريق. تُستخدم كأداة تخطيط داخلية ووسيلة تواصل مع الممولين."}, {"term_fr": "Étude de faisabilité", "term_en": "Feasibility study", "term_ar": "دراسة الجدوى", "tag_fr": "Outil", "tag_en": "Tool", "tag_ar": "أداة", "def_fr": "Analyse préalable au lancement d'un projet visant à évaluer sa viabilité technique, économique, financière, juridique et opérationnelle, permettant d'identifier les risques, les ressources nécessaires et les conditions de succès avant l'engagement.", "def_en": "An analysis conducted prior to launching a project to assess its technical, economic, financial, legal and operational viability, identifying risks, required resources and success conditions before commitment.", "def_ar": "تحليل يُجرى قبل إطلاق مشروع ما لتقييم جدواه التقنية والاقتصادية والمالية والقانونية والتشغيلية، بما يتيح تحديد المخاطر والموارد اللازمة وشروط النجاح قبل الالتزام بالمشروع."}, {"term_fr": "Mapping stratégique / cartographie des acteurs", "term_en": "Stakeholder mapping", "term_ar": "خارطة الفاعلين", "tag_fr": "Outil", "tag_en": "Tool", "tag_ar": "أداة", "def_fr": "Méthode d'analyse qui identifie, catégorise et visualise l'ensemble des parties prenantes d'un secteur ou d'un territoire, leurs rôles, leurs relations et leurs influences mutuelles — outil de base pour toute stratégie d'intervention.", "def_en": "An analytical method that identifies, categorises and visualises all stakeholders in a sector or territory, their roles, relationships and mutual influence — a basic tool for any intervention strategy.", "def_ar": "منهجية تحليل تحدد وتصنّف وتُظهر بصريًا مجمل الأطراف المعنية في قطاع أو منطقة معينة، وأدوارهم وعلاقاتهم وتأثيرهم المتبادل — وهي أداة أساسية لأي استراتيجية تدخل."}, {"term_fr": "Modèle économique (business model)", "term_en": "Business model", "term_ar": "النموذج الاقتصادي (بزنس موديل)", "tag_fr": "Outil", "tag_en": "Tool", "tag_ar": "أداة", "def_fr": "Description de la façon dont une organisation crée, délivre et capture de la valeur : sources de revenus, coûts principaux, ressources clés, partenariats et segments de clientèle. Le Canvas de Business Model (Osterwalder) est l'outil de formalisation le plus répandu.", "def_en": "A description of how an organisation creates, delivers and captures value: revenue streams, main costs, key resources, partnerships and customer segments. The Business Model Canvas (Osterwalder) is the most widely used formalisation tool.", "def_ar": "وصف للطريقة التي تخلق بها المؤسسة القيمة وتقدّمها وتحقّق منها عائدًا: مصادر الدخل، التكاليف الرئيسية، الموارد الأساسية، الشراكات وشرائح الزبائن. يُعد نموذج Business Model Canvas (أوسترفالدر) الأداة الأكثر شيوعًا لصياغته."}, {"term_fr": "SWOT / FFOM", "term_en": "SWOT analysis", "term_ar": "تحليل سوات (SWOT)", "tag_fr": "Outil", "tag_en": "Tool", "tag_ar": "أداة", "def_fr": "Outil d'analyse stratégique identifiant les Forces (Strengths), Faiblesses (Weaknesses), Opportunités (Opportunities) et Menaces (Threats) d'une organisation ou d'un projet, articulant analyse interne et analyse externe pour orienter les choix stratégiques.", "def_en": "A strategic analysis tool identifying the Strengths, Weaknesses, Opportunities and Threats of an organisation or project, combining internal and external analysis to guide strategic choices.", "def_ar": "أداة تحليل استراتيجي تحدد نقاط القوة والضعف والفرص والتهديدات لمؤسسة أو مشروع ما، وتجمع بين التحليل الداخلي والخارجي لتوجيه الخيارات الاستراتيجية."}]}, {"id": "ess", "label_fr": "Économie sociale & solidaire", "label_en": "Social & Solidarity Economy", "label_ar": "الاقتصاد الاجتماعي والتضامني", "color": "#0F6E56", "terms": [{"term_fr": "Économie sociale et solidaire (ESS)", "term_en": "Social and solidarity economy (SSE)", "term_ar": "الاقتصاد الاجتماعي والتضامني", "tag_fr": "Secteur", "tag_en": "Sector", "tag_ar": "قطاع", "def_fr": "Ensemble des entreprises et organisations (coopératives, mutuelles, associations, fondations) qui poursuivent des objectifs économiques et sociaux simultanément, plaçant la solidarité, la démocratie interne et la finalité sociale avant la maximisation du profit.", "def_en": "The set of enterprises and organisations (cooperatives, mutual societies, associations, foundations) that pursue economic and social objectives simultaneously, placing solidarity, internal democracy and social purpose above profit maximisation.", "def_ar": "مجموع المؤسسات والمنظمات (تعاونيات، تعاضديات، جمعيات، مؤسسات) التي تجمع بين أهداف اقتصادية واجتماعية في آن واحد، وتضع التضامن والديمقراطية الداخلية والغاية الاجتماعية فوق مبدأ تعظيم الربح."}, {"term_fr": "Coopérative", "term_en": "Cooperative", "term_ar": "التعاونية", "tag_fr": "Forme juridique", "tag_en": "Legal form", "tag_ar": "شكل قانوني", "def_fr": "Entreprise dont les membres sont à la fois associés et usagers, producteurs ou salariés, fonctionnant selon le principe démocratique « une personne, une voix », conformément aux principes coopératifs internationaux de l'Alliance coopérative internationale.", "def_en": "An enterprise whose members are simultaneously associates and users, producers or employees, operating on the democratic principle of \"one member, one vote\", in line with the international cooperative principles of the International Co-operative Alliance.", "def_ar": "مؤسسة يكون أعضاؤها في آن واحد منخرطين ومنتفعين أو منتجين أو أجراء، وتعمل وفق المبدأ الديمقراطي «شخص واحد، صوت واحد»، تماشياً مع المبادئ التعاونية الدولية للتحالف التعاوني الدولي."}, {"term_fr": "Gouvernance participative", "term_en": "Participatory governance", "term_ar": "الحوكمة التشاركية", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Mode de gestion d'une organisation qui associe l'ensemble des parties prenantes (membres, salariés, bénéficiaires, partenaires) aux prises de décision, selon des règles de transparence et d'égalité. Principe fondateur de l'économie sociale et solidaire.", "def_en": "A mode of organisational management that involves all stakeholders (members, staff, beneficiaries, partners) in decision-making, under rules of transparency and equality. A founding principle of the social and solidarity economy.", "def_ar": "نمط إدارة لمؤسسة ما يُشرك جميع الأطراف المعنية (الأعضاء، الأجراء، المستفيدين، الشركاء) في اتخاذ القرار، وفق قواعد الشفافية والمساواة، ويُعد مبدأً مؤسِّسًا للاقتصاد الاجتماعي والتضامني."}, {"term_fr": "Fonds d'innovation sociale", "term_en": "Social innovation fund", "term_ar": "صندوق الابتكار الاجتماعي", "tag_fr": "Mécanisme", "tag_en": "Mechanism", "tag_ar": "آلية", "def_fr": "Mécanisme de financement ciblant des projets ou idées socialement innovants portés par des individus ou des collectifs, accompagnant les porteurs de la phase d'idéation jusqu'à la création d'une structure, en combinant financement et appui technique.", "def_en": "A funding mechanism targeting socially innovative projects or ideas led by individuals or groups, supporting them from the ideation phase through to the creation of a structure, combining financing with technical support.", "def_ar": "آلية تمويل تستهدف مشاريع أو أفكارًا مبتكرة اجتماعيًا يحملها أفراد أو جماعات، وترافقهم من مرحلة بلورة الفكرة إلى تأسيس هيكل قانوني، وتجمع بين التمويل والدعم التقني."}, {"term_fr": "Re-Fund Challenge", "term_en": "Re-Fund Challenge", "term_ar": "تحدي إعادة التمويل", "tag_fr": "Mécanisme", "tag_en": "Mechanism", "tag_ar": "آلية", "def_fr": "Mécanisme de financement et d'accompagnement conçu pour renforcer des organisations de l'économie sociale et solidaire déjà existantes mais fragilisées, combinant subvention, renforcement de capacités et incubation.", "def_en": "A financing and support mechanism designed to strengthen existing but weakened social and solidarity economy organisations, combining grant funding, capacity building and incubation.", "def_ar": "آلية تمويل ومرافقة صُممت لتعزيز مؤسسات قائمة تابعة للاقتصاد الاجتماعي والتضامني لكنها في وضع هش، وتجمع بين المنحة وتعزيز القدرات والاحتضان."}, {"term_fr": "Market Fund", "term_en": "Market fund", "term_ar": "صندوق التسويق", "tag_fr": "Mécanisme", "tag_en": "Mechanism", "tag_ar": "آلية", "def_fr": "Mécanisme visant à renforcer les capacités commerciales et de mise en marché des organisations de l'économie sociale et solidaire, pour leur permettre d'accéder à de nouveaux marchés nationaux et internationaux.", "def_en": "A mechanism aimed at strengthening the commercial and market-access capacities of social and solidarity economy organisations, enabling them to reach new national and international markets.", "def_ar": "آلية تهدف إلى تعزيز القدرات التجارية والتسويقية لمؤسسات الاقتصاد الاجتماعي والتضامني، بما يمكّنها من الولوج إلى أسواق وطنية ودولية جديدة."}, {"term_fr": "Club ESS", "term_en": "SSE club", "term_ar": "نادي الاقتصاد الاجتماعي والتضامني", "tag_fr": "Mécanisme", "tag_en": "Mechanism", "tag_ar": "آلية", "def_fr": "Structure légère créée au sein d'un établissement scolaire, d'une structure de jeunesse ou d'une université pour initier les jeunes aux principes de l'économie sociale et solidaire et à l'entrepreneuriat collectif.", "def_en": "A light-touch structure set up within a school, youth facility or university to introduce young people to the principles of the social and solidarity economy and collective entrepreneurship.", "def_ar": "هيكل خفيف يُحدث داخل مؤسسة تربوية أو هيكل شبابي أو جامعة لتعريف الشباب بمبادئ الاقتصاد الاجتماعي والتضامني وريادة الأعمال الجماعية."}, {"term_fr": "Chaîne de valeur solidaire", "term_en": "Solidarity-based value chain", "term_ar": "سلسلة القيمة التضامنية", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Organisation d'une filière économique intégrant des acteurs de l'économie sociale et solidaire à différents niveaux (production, transformation, distribution), avec des principes de répartition équitable de la valeur ajoutée entre tous les maillons.", "def_en": "The organisation of an economic sector integrating social and solidarity economy actors at different levels (production, processing, distribution), based on principles of fair distribution of added value across the chain.", "def_ar": "تنظيم لسلسلة اقتصادية يُدمج فاعلين من الاقتصاد الاجتماعي والتضامني على مستويات مختلفة (الإنتاج، التحويل، التوزيع)، وفق مبادئ توزيع عادل للقيمة المضافة بين مختلف الحلقات."}]}, {"id": "environnement", "label_fr": "Environnement & développement durable", "label_en": "Environment & Sustainable Development", "label_ar": "البيئة والتنمية المستدامة", "color": "#3B6D11", "terms": [{"term_fr": "Économie verte", "term_en": "Green economy", "term_ar": "الاقتصاد الأخضر", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Modèle économique, défini par le PNUE, qui vise à améliorer le bien-être humain et l'équité sociale tout en réduisant significativement les risques environnementaux et la pénurie écologique, reposant sur trois piliers : faible émission de carbone, utilisation efficiente des ressources, inclusion sociale.", "def_en": "An economic model, as defined by UNEP, that aims to improve human well-being and social equity while significantly reducing environmental risks and ecological scarcity, resting on three pillars: low carbon emissions, resource efficiency and social inclusion.", "def_ar": "نموذج اقتصادي، وفق تعريف برنامج الأمم المتحدة للبيئة، يهدف إلى تحسين الرفاه البشري والإنصاف الاجتماعي مع الحد بشكل كبير من المخاطر البيئية والندرة الإيكولوجية، ويقوم على ثلاث ركائز: انخفاض انبعاثات الكربون، الاستخدام الرشيد للموارد، والإدماج الاجتماعي."}, {"term_fr": "Économie circulaire", "term_en": "Circular economy", "term_ar": "الاقتصاد الدائري", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Modèle économique qui s'oppose au modèle linéaire (extraire-produire-jeter) en cherchant à maintenir les ressources, les produits et les matières dans le cycle économique le plus longtemps possible, en réduisant les déchets et en favorisant la réutilisation, la réparation et le recyclage.", "def_en": "An economic model that stands in contrast to the linear model (take-make-dispose), seeking to keep resources, products and materials in the economic cycle for as long as possible by reducing waste and promoting reuse, repair and recycling.", "def_ar": "نموذج اقتصادي يقابل النموذج الخطي (استخراج-إنتاج-تخلص)، ويسعى إلى إبقاء الموارد والمنتجات والمواد ضمن الدورة الاقتصادية لأطول مدة ممكنة، من خلال الحد من النفايات وتشجيع إعادة الاستخدام والإصلاح والتدوير."}, {"term_fr": "Tourisme durable", "term_en": "Sustainable tourism", "term_ar": "السياحة المستدامة", "tag_fr": "Secteur", "tag_en": "Sector", "tag_ar": "قطاع", "def_fr": "Selon l'Organisation mondiale du tourisme (OMT), forme de tourisme qui prend pleinement en compte ses impacts économiques, sociaux et environnementaux actuels et futurs, en répondant aux besoins des visiteurs, des professionnels du secteur, de l'environnement et des communautés d'accueil.", "def_en": "As defined by the World Tourism Organization (UNWTO), a form of tourism that fully accounts for its current and future economic, social and environmental impacts, addressing the needs of visitors, the industry, the environment and host communities.", "def_ar": "وفق تعريف منظمة السياحة العالمية، شكل من أشكال السياحة يراعي بشكل كامل آثاره الاقتصادية والاجتماعية والبيئية الحالية والمستقبلية، ويستجيب لاحتياجات الزوار والمهنيين في القطاع والبيئة والمجتمعات المضيفة."}, {"term_fr": "Adaptation au changement climatique", "term_en": "Climate change adaptation", "term_ar": "التكيف مع تغير المناخ", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Ensemble des ajustements que les systèmes naturels, humains ou économiques doivent opérer pour répondre aux effets actuels ou attendus du changement climatique, se distinguant de l'atténuation (réduction des causes) et visant à réduire la vulnérabilité des populations et des écosystèmes.", "def_en": "The set of adjustments that natural, human or economic systems must make in response to actual or expected effects of climate change, as distinct from mitigation (reducing causes), aiming to reduce the vulnerability of populations and ecosystems.", "def_ar": "مجموع التعديلات التي يتعين على الأنظمة الطبيعية أو البشرية أو الاقتصادية إجراؤها للاستجابة للآثار الحالية أو المتوقعة لتغير المناخ، وتختلف عن التخفيف (الحد من الأسباب)، وتهدف إلى تقليص هشاشة السكان والنظم الإيكولوجية."}, {"term_fr": "Agriculture durable", "term_en": "Sustainable agriculture", "term_ar": "الفلاحة المستدامة", "tag_fr": "Secteur", "tag_en": "Sector", "tag_ar": "قطاع", "def_fr": "Pratiques agricoles qui satisfont les besoins alimentaires actuels sans compromettre la capacité des générations futures à satisfaire les leurs, intégrant les dimensions économique, sociale et environnementale (préservation des sols, de l'eau et de la biodiversité).", "def_en": "Farming practices that meet current food needs without compromising the ability of future generations to meet theirs, integrating economic, social and environmental dimensions (soil, water and biodiversity conservation).", "def_ar": "ممارسات فلاحية تلبّي الاحتياجات الغذائية الحالية دون المساس بقدرة الأجيال القادمة على تلبية احتياجاتها، وتدمج الأبعاد الاقتصادية والاجتماعية والبيئية (الحفاظ على التربة والماء والتنوع البيولوجي)."}, {"term_fr": "Écotourisme", "term_en": "Ecotourism", "term_ar": "السياحة البيئية", "tag_fr": "Secteur", "tag_en": "Sector", "tag_ar": "قطاع", "def_fr": "Forme de tourisme responsable dans des zones naturelles qui contribue à la conservation de l'environnement, assure le bien-être des populations locales et implique une démarche d'interprétation et d'éducation, selon la définition de l'Union internationale pour la conservation de la nature.", "def_en": "A form of responsible travel to natural areas that conserves the environment, sustains the well-being of local people, and involves interpretation and education, as defined by the International Union for Conservation of Nature.", "def_ar": "شكل من أشكال السياحة المسؤولة في المناطق الطبيعية يساهم في الحفاظ على البيئة ويضمن رفاه السكان المحليين ويتضمن بُعدًا تفسيريًا وتربويًا، وفق تعريف الاتحاد الدولي لحفظ الطبيعة."}, {"term_fr": "Responsabilité sociale des entreprises (RSE)", "term_en": "Corporate social responsibility (CSR)", "term_ar": "المسؤولية الاجتماعية للمؤسسات", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Intégration volontaire par les entreprises de préoccupations sociales et environnementales dans leurs activités commerciales et dans leurs relations avec leurs parties prenantes, allant au-delà de la conformité légale pour englober des engagements éthiques et environnementaux.", "def_en": "The voluntary integration by companies of social and environmental concerns into their business operations and their relations with stakeholders, going beyond legal compliance to encompass ethical and environmental commitments.", "def_ar": "إدماج طوعي من قبل المؤسسات للاهتمامات الاجتماعية والبيئية في أنشطتها التجارية وعلاقاتها مع أصحاب المصلحة، بما يتجاوز الامتثال القانوني ليشمل التزامات أخلاقية وبيئية."}, {"term_fr": "ODD (Objectifs de Développement Durable)", "term_en": "SDGs (Sustainable Development Goals)", "term_ar": "أهداف التنمية المستدامة", "tag_fr": "Cadre de référence", "tag_en": "Reference framework", "tag_ar": "إطار مرجعي", "def_fr": "Les 17 objectifs adoptés par l'ONU en 2015 dans le cadre de l'Agenda 2030, visant à éradiquer la pauvreté, protéger la planète et assurer la prospérité pour tous. Ils constituent le cadre de référence universel de la coopération internationale au développement.", "def_en": "The 17 goals adopted by the UN in 2015 under the 2030 Agenda, aiming to end poverty, protect the planet and ensure prosperity for all. They constitute the universal reference framework for international development cooperation.", "def_ar": "الأهداف السبعة عشر التي اعتمدتها الأمم المتحدة سنة 2015 في إطار خطة 2030، وتهدف إلى القضاء على الفقر وحماية كوكب الأرض وضمان الازدهار للجميع. تشكّل هذه الأهداف الإطار المرجعي العالمي للتعاون الدولي من أجل التنمية."}]}, {"id": "numerique", "label_fr": "Numérique, IA & données", "label_en": "Digital, AI & Data", "label_ar": "الرقمنة والذكاء الاصطناعي والبيانات", "color": "#185FA5", "terms": [{"term_fr": "Transformation numérique", "term_en": "Digital transformation", "term_ar": "التحول الرقمي", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Processus d'intégration des technologies numériques dans l'ensemble des fonctions d'une organisation ou d'un service public, transformant fondamentalement la façon dont elle opère et délivre de la valeur — ne se réduisant pas à la seule informatisation des processus existants.", "def_en": "The process of integrating digital technologies into all functions of an organisation or public service, fundamentally changing how it operates and delivers value — going beyond the mere digitisation of existing processes.", "def_ar": "عملية دمج التقنيات الرقمية في جميع وظائف مؤسسة أو خدمة عمومية، بما يغيّر جذريًا طريقة عملها وتقديمها للقيمة، ولا تقتصر على مجرد رقمنة المسارات القائمة."}, {"term_fr": "Intelligence artificielle (IA)", "term_en": "Artificial intelligence (AI)", "term_ar": "الذكاء الاصطناعي", "tag_fr": "Technologie", "tag_en": "Technology", "tag_ar": "تكنولوجيا", "def_fr": "Ensemble de techniques permettant à des machines de simuler certaines fonctions de l'intelligence humaine : reconnaissance de formes, traitement du langage naturel, prise de décision, apprentissage automatique. L'IA générative, capable de produire du texte, des images ou du code, en représente la vague la plus récente.", "def_en": "A set of techniques enabling machines to simulate certain functions of human intelligence: pattern recognition, natural language processing, decision-making, machine learning. Generative AI, capable of producing text, images or code, represents the most recent wave.", "def_ar": "مجموعة من التقنيات التي تتيح للآلات محاكاة بعض وظائف الذكاء البشري: التعرف على الأنماط، معالجة اللغة الطبيعية، اتخاذ القرار، التعلم الآلي. ويمثّل الذكاء الاصطناعي التوليدي، القادر على إنتاج نصوص وصور وأكواد، أحدث موجاته."}, {"term_fr": "Apprentissage automatique (machine learning)", "term_en": "Machine learning", "term_ar": "التعلم الآلي", "tag_fr": "Technologie", "tag_en": "Technology", "tag_ar": "تكنولوجيا", "def_fr": "Sous-domaine de l'intelligence artificielle dans lequel des algorithmes apprennent à partir de données pour améliorer leurs performances sans être explicitement programmés. Il sous-tend des applications comme la détection de fraude, la recommandation de contenu ou le profilage des demandeurs d'emploi.", "def_en": "A subfield of artificial intelligence in which algorithms learn from data to improve their performance without being explicitly programmed. It underlies applications such as fraud detection, content recommendation and job-seeker profiling.", "def_ar": "فرع من فروع الذكاء الاصطناعي تتعلم فيه الخوارزميات من البيانات لتحسين أدائها دون برمجة صريحة. ويقوم عليه تطبيقات مثل كشف الاحتيال، والتوصية بالمحتوى، وتصنيف الباحثين عن عمل."}, {"term_fr": "Protection des données personnelles", "term_en": "Personal data protection", "term_ar": "حماية المعطيات الشخصية", "tag_fr": "Droit", "tag_en": "Law", "tag_ar": "قانون", "def_fr": "Ensemble des règles juridiques qui encadrent la collecte, le traitement, la conservation et la transmission de données à caractère personnel, c'est-à-dire toute information permettant d'identifier directement ou indirectement une personne physique.", "def_en": "The set of legal rules governing the collection, processing, storage and transmission of personal data — i.e. any information enabling the direct or indirect identification of a natural person.", "def_ar": "مجموعة من القواعد القانونية التي تُنظّم جمع البيانات ذات الطابع الشخصي ومعالجتها وحفظها ونقلها، أي كل معلومة تتيح التعرف بشكل مباشر أو غير مباشر على شخص طبيعي."}, {"term_fr": "RGPD / principes de protection des données", "term_en": "GDPR / data protection principles", "term_ar": "اللائحة العامة لحماية البيانات ومبادئها", "tag_fr": "Cadre réglementaire", "tag_en": "Regulatory framework", "tag_ar": "إطار تنظيمي", "def_fr": "Le Règlement Général sur la Protection des Données (RGPD) est le cadre européen de référence applicable au traitement des données personnelles. Ses principes fondamentaux — licéité, minimisation, finalité, intégrité, responsabilité — constituent un standard international de référence en la matière.", "def_en": "The General Data Protection Regulation (GDPR) is the EU's reference framework for personal data processing. Its core principles — lawfulness, data minimisation, purpose limitation, integrity and accountability — serve as an international reference standard in this field.", "def_ar": "اللائحة العامة لحماية البيانات هي الإطار الأوروبي المرجعي المطبق على معالجة البيانات الشخصية. وتشكّل مبادئها الأساسية — المشروعية، التقليص، تحديد الغرض، السلامة، المساءلة — معيارًا دوليًا مرجعيًا في هذا المجال."}, {"term_fr": "Inclusion numérique", "term_en": "Digital inclusion", "term_ar": "الإدماج الرقمي", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Capacité pour tous les individus et groupes d'accéder aux technologies de l'information et de la communication (TIC) et de les utiliser de manière efficace pour participer à la vie économique, sociale et culturelle, supposant accès aux équipements, connectivité et compétences numériques.", "def_en": "The ability of all individuals and groups to access and effectively use information and communication technologies (ICT) to participate in economic, social and cultural life, requiring access to equipment, connectivity and digital skills.", "def_ar": "قدرة جميع الأفراد والفئات على الولوج إلى تكنولوجيا المعلومات والاتصال واستخدامها بفعالية للمشاركة في الحياة الاقتصادية والاجتماعية والثقافية، وهو ما يتطلب توفر التجهيزات والاتصال والمهارات الرقمية."}, {"term_fr": "Compétences numériques", "term_en": "Digital skills", "term_ar": "المهارات الرقمية", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Ensemble des aptitudes permettant à un individu d'utiliser les outils numériques de manière efficace, critique et sécurisée : bureautique, navigation web, communication en ligne, sécurité informatique, création de contenu. Le référentiel européen DigComp en définit cinq domaines.", "def_en": "The set of abilities enabling an individual to use digital tools effectively, critically and safely: office software, web browsing, online communication, cybersecurity, content creation. The European DigComp framework defines five such domains.", "def_ar": "مجموعة القدرات التي تمكّن الفرد من استخدام الأدوات الرقمية بفعالية وبروح نقدية وبأمان: المكتبية، التصفح، التواصل عبر الإنترنت، الأمن المعلوماتي، إنتاج المحتوى. ويحدد الإطار المرجعي الأوروبي DigComp خمسة مجالات لهذه المهارات."}, {"term_fr": "Open data", "term_en": "Open data", "term_ar": "البيانات المفتوحة", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Principe selon lequel certaines données, notamment celles produites par des organismes publics, doivent être librement accessibles, réutilisables et redistribuables sans restriction, favorisant la transparence, l'innovation et la participation citoyenne.", "def_en": "The principle that certain data, particularly that produced by public bodies, should be freely accessible, reusable and redistributable without restriction, fostering transparency, innovation and civic participation.", "def_ar": "مبدأ يقضي بأن تكون بعض البيانات، لا سيما تلك الصادرة عن الهيئات العمومية، متاحة بحرية وقابلة لإعادة الاستخدام والتوزيع دون قيود، بما يعزز الشفافية والابتكار والمشاركة المواطنية."}]}, {"id": "culture", "label_fr": "Culture, sport & inclusion", "label_en": "Culture, Sport & Inclusion", "label_ar": "الثقافة والرياضة والإدماج", "color": "#993556", "terms": [{"term_fr": "Culture et sport pour le développement", "term_en": "Culture and sport for development", "term_ar": "الثقافة والرياضة من أجل التنمية", "tag_fr": "Approche", "tag_en": "Approach", "tag_ar": "مقاربة", "def_fr": "Reconnaissance, promue notamment par l'UNESCO, du rôle de la pratique culturelle et sportive comme vecteurs d'inclusion sociale, de développement des compétences, de construction identitaire et de cohésion civique — la culture et le sport n'étant pas des accessoires mais des conditions fondamentales d'épanouissement.", "def_en": "Recognition, notably promoted by UNESCO, of the role of cultural and sporting practice as vehicles for social inclusion, skills development, identity building and civic cohesion — culture and sport being fundamental conditions for human fulfilment rather than accessories.", "def_ar": "إقرار، تروّج له منظمة اليونسكو خاصة، بدور الممارسة الثقافية والرياضية كأداتين للإدماج الاجتماعي وتنمية المهارات وبناء الهوية وتحقيق التماسك المدني، باعتبار الثقافة والرياضة شرطين أساسيين للازدهار الإنساني لا مجرد كماليات."}, {"term_fr": "Gouvernance du sport", "term_en": "Sport governance", "term_ar": "حوكمة الرياضة", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Ensemble des principes, règles et mécanismes qui régissent le fonctionnement des institutions sportives (fédérations, clubs, structures publiques) : transparence, redevabilité, égalité d'accès, intégrité — conditions d'un développement équitable et durable du secteur.", "def_en": "The set of principles, rules and mechanisms governing the functioning of sporting institutions (federations, clubs, public bodies): transparency, accountability, equal access, integrity — the conditions for equitable and sustainable development of the sector.", "def_ar": "مجموع المبادئ والقواعد والآليات التي تحكم عمل المؤسسات الرياضية (جامعات، أندية، هياكل عمومية): الشفافية، المساءلة، تكافؤ الولوج، النزاهة، وهي شروط لتطور القطاع بشكل عادل ومستدام."}, {"term_fr": "Sport alternatif", "term_en": "Alternative sport", "term_ar": "الرياضة البديلة", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Pratiques sportives en dehors des disciplines classiques institutionnalisées et fédérées : sports urbains (skateboard, parkour, BMX), sports de nature (randonnée, escalade), arts martiaux traditionnels et jeux traditionnels — souvent plus accessibles en termes d'équipements et de coûts.", "def_en": "Sporting practices outside classic institutionalised and federated disciplines: urban sports (skateboarding, parkour, BMX), nature sports (hiking, climbing), traditional martial arts and traditional games — often more accessible in terms of equipment and cost.", "def_ar": "ممارسات رياضية خارج الاختصاصات الكلاسيكية المهيكلة والمنضوية تحت جامعات: الرياضات الحضرية (التزلج، الباركور، الدراجات BMX)، رياضات الطبيعة (المشي، تسلق الصخور)، الفنون القتالية التقليدية والألعاب التراثية — وغالبًا ما تكون أقل تكلفة من حيث التجهيزات."}, {"term_fr": "Jeux traditionnels", "term_en": "Traditional games", "term_ar": "الألعاب التقليدية", "tag_fr": "Culture", "tag_en": "Culture", "tag_ar": "ثقافة", "def_fr": "Pratiques ludiques et sportives transmises culturellement au sein d'une communauté, reflétant son histoire et ses valeurs, et constituant un élément du patrimoine culturel immatériel selon la Convention de l'UNESCO de 2003.", "def_en": "Playful and sporting practices culturally transmitted within a community, reflecting its history and values, and forming part of the intangible cultural heritage under the 2003 UNESCO Convention.", "def_ar": "ممارسات ترفيهية ورياضية تنتقل ثقافيًا داخل مجتمع معين، تعكس تاريخه وقيمه، وتُعد عنصرًا من عناصر التراث الثقافي غير المادي وفق اتفاقية اليونسكو لسنة 2003."}, {"term_fr": "Médiation culturelle", "term_en": "Cultural mediation", "term_ar": "الوساطة الثقافية", "tag_fr": "Métier", "tag_en": "Profession", "tag_ar": "مهنة", "def_fr": "Activité professionnelle visant à faciliter la rencontre entre des publics — notamment éloignés de la culture institutionnelle — et des œuvres, pratiques ou lieux culturels. Le médiateur culturel traduit, explique, anime et crée des passerelles entre la création artistique et la vie quotidienne des citoyens.", "def_en": "A professional activity aimed at facilitating encounters between audiences — particularly those distant from institutional culture — and cultural works, practices or venues. The cultural mediator translates, explains, animates and builds bridges between artistic creation and citizens' everyday lives.", "def_ar": "نشاط مهني يهدف إلى تيسير اللقاء بين الجمهور — لا سيما من هم بعيدون عن الثقافة المؤسساتية — والأعمال أو الممارسات أو الفضاءات الثقافية. يقوم الوسيط الثقافي بالترجمة والشرح والتنشيط وبناء جسور بين الإبداع الفني والحياة اليومية للمواطنين."}, {"term_fr": "Industries culturelles et créatives (ICC)", "term_en": "Cultural and creative industries (CCI)", "term_ar": "الصناعات الثقافية والإبداعية", "tag_fr": "Secteur", "tag_en": "Sector", "tag_ar": "قطاع", "def_fr": "Secteurs économiques, selon la définition de l'UNESCO, qui produisent des biens et services à fort contenu symbolique et créatif : musique, cinéma, arts de la scène, design, jeux vidéo, mode, architecture, artisanat d'art — filières d'emplois à forte valeur ajoutée.", "def_en": "Economic sectors, as defined by UNESCO, that produce goods and services with strong symbolic and creative content: music, film, performing arts, design, video games, fashion, architecture, arts and crafts — high value-added employment sectors.", "def_ar": "قطاعات اقتصادية، وفق تعريف اليونسكو، تنتج سلعًا وخدمات ذات محتوى رمزي وإبداعي عالٍ: الموسيقى، السينما، فنون الأداء، التصميم، ألعاب الفيديو، الأزياء، الهندسة المعمارية، الصناعات التقليدية الفنية — وهي مجالات تشغيل ذات قيمة مضافة عالية."}, {"term_fr": "Maison des Jeunes", "term_en": "Youth centre", "term_ar": "دار الشباب", "tag_fr": "Structure", "tag_en": "Facility", "tag_ar": "هيكل", "def_fr": "Structure de proximité de service public offrant des activités culturelles, sportives et éducatives aux jeunes, généralement implantée au niveau local dans le cadre des politiques publiques de jeunesse.", "def_en": "A grassroots public-service facility offering cultural, sporting and educational activities to young people, typically established at local level as part of public youth policy.", "def_ar": "هيكل عمومي قريب من المواطن يوفّر أنشطة ثقافية ورياضية وتربوية للشباب، وعادة ما يكون متواجدًا على المستوى المحلي في إطار السياسات العمومية للشباب."}, {"term_fr": "Maison de la Culture", "term_en": "Cultural centre", "term_ar": "دار الثقافة", "tag_fr": "Structure", "tag_en": "Facility", "tag_ar": "هيكل", "def_fr": "Structure de proximité de service public dédiée à la diffusion et à la pratique artistique et culturelle, généralement implantée au niveau local dans le cadre des politiques publiques culturelles.", "def_en": "A grassroots public-service facility dedicated to the dissemination and practice of art and culture, typically established at local level as part of public cultural policy.", "def_ar": "هيكل عمومي قريب من المواطن مخصّص لنشر الممارسة الفنية والثقافية، وعادة ما يكون متواجدًا على المستوى المحلي في إطار السياسات الثقافية العمومية."}]}, {"id": "gouvernance", "label_fr": "Gouvernance & politiques publiques", "label_en": "Governance & Public Policy", "label_ar": "الحوكمة والسياسات العمومية", "color": "#993C1D", "terms": [{"term_fr": "Gouvernance locale", "term_en": "Local governance", "term_ar": "الحوكمة المحلية", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Capacité des collectivités territoriales à gérer les affaires publiques de manière efficace, transparente et participative : planification des investissements, gestion des services publics, consultation citoyenne et coordination avec les acteurs locaux.", "def_en": "The capacity of local authorities to manage public affairs effectively, transparently and participatively: investment planning, management of public services, citizen consultation and coordination with local actors.", "def_ar": "قدرة الجماعات المحلية على تسيير الشأن العام بفعالية وشفافية وبروح تشاركية: التخطيط للاستثمار، إدارة الخدمات العمومية، التشاور مع المواطنين، والتنسيق مع الفاعلين المحليين."}, {"term_fr": "Décentralisation", "term_en": "Decentralisation", "term_ar": "اللامركزية", "tag_fr": "Réforme", "tag_en": "Reform", "tag_ar": "إصلاح", "def_fr": "Transfert de compétences, de ressources et de responsabilités du niveau central vers les collectivités locales, permettant à ces dernières d'exercer des attributions relevant auparavant de l'administration centrale.", "def_en": "The transfer of powers, resources and responsibilities from the central level to local authorities, enabling the latter to exercise functions previously held by central government.", "def_ar": "نقل الصلاحيات والموارد والمسؤوليات من المستوى المركزي إلى الجماعات المحلية، بما يتيح لهذه الأخيرة ممارسة اختصاصات كانت من قبل من مشمولات الإدارة المركزية."}, {"term_fr": "Politique publique jeunesse", "term_en": "Youth public policy", "term_ar": "السياسة العمومية للشباب", "tag_fr": "Concept", "tag_en": "Concept", "tag_ar": "مفهوم", "def_fr": "Ensemble des orientations, programmes et dispositifs mis en œuvre par les pouvoirs publics pour répondre aux besoins et aspirations des jeunes citoyens, dans les domaines de l'emploi, de la formation, de la culture, du sport et de la participation civique.", "def_en": "The set of orientations, programmes and mechanisms implemented by public authorities to address the needs and aspirations of young citizens, in the fields of employment, training, culture, sport and civic participation.", "def_ar": "مجموع التوجهات والبرامج والآليات التي تعتمدها السلطات العمومية للاستجابة لحاجيات وتطلعات المواطنين الشباب، في مجالات التشغيل والتكوين والثقافة والرياضة والمشاركة المدنية."}, {"term_fr": "Cadre de concertation interministériel", "term_en": "Interministerial consultation framework", "term_ar": "إطار التشاور بين الوزارات", "tag_fr": "Mécanisme", "tag_en": "Mechanism", "tag_ar": "آلية", "def_fr": "Instance de coordination réunissant les représentants de plusieurs ministères et institutions autour d'une politique ou d'un programme transversal, assurant le suivi conjoint et la cohérence de l'action publique entre les différents départements concernés.", "def_en": "A coordination body bringing together representatives of several ministries and institutions around a cross-cutting policy or programme, ensuring joint monitoring and the coherence of public action across the departments concerned.", "def_ar": "هيكل تنسيق يجمع ممثلي عدة وزارات ومؤسسات حول سياسة أو برنامج أفقي، ويضمن المتابعة المشتركة وانسجام العمل العمومي بين مختلف الإدارات المعنية."}, {"term_fr": "Plan d'investissement annuel (PIA)", "term_en": "Annual investment plan (AIP)", "term_ar": "خطة الاستثمار السنوية", "tag_fr": "Outil", "tag_en": "Tool", "tag_ar": "أداة", "def_fr": "Document de planification budgétaire élaboré par une collectivité locale pour programmer ses dépenses d'investissement sur l'année à venir. Il constitue l'un des principaux outils de planification financière des collectivités locales.", "def_en": "A budgetary planning document prepared by a local authority to schedule its investment spending for the coming year. It is one of the main financial planning tools used by local authorities.", "def_ar": "وثيقة تخطيط ميزانياتي تُعدّها جماعة محلية لبرمجة نفقاتها الاستثمارية للسنة القادمة، وتُعد من أبرز أدوات التخطيط المالي للجماعات المحلية."}, {"term_fr": "Stratégie locale jeunesse", "term_en": "Local youth strategy", "term_ar": "الاستراتيجية المحلية للشباب", "tag_fr": "Outil", "tag_en": "Tool", "tag_ar": "أداة", "def_fr": "Document de planification élaboré par une collectivité locale définissant ses priorités et actions en faveur des jeunes, en concertation avec les acteurs locaux (associations, clubs, écoles), traduisant l'engagement de la collectivité envers sa jeunesse en objectifs et activités concrètes.", "def_en": "A planning document prepared by a local authority setting out its priorities and actions for young people, in consultation with
